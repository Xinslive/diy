# Alembic 配置。
#
# 这里**故意不写 sqlalchemy.url**：真正的连接串一律从 app.core.config.settings
# 取（见 migrations/env.py）。写死一份就多出一个能和实际配置对不上的地方 ——
# 而「迁移打在哪个库上」这件事一旦对不上，破坏性变更打错库的后果无法挽回。
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
