[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# -n 6（xdist 并行）：全量实测 178s -> 26s（连续三次 26/25/28s）。
# 默认 6 而不是 -n auto：本机 10 核，但 8/10 实测反而更慢 ——
# 这些用例大量走磁盘和 PostgreSQL，加到 6 之后瓶颈从 CPU 变成 IO，
# 再加 worker 只会互相抢。要跑串行（调试单条用例时）用 `-p no:xdist` 或 `-n 0`。
# CI 在命令行上覆盖成 -n 3（4 vCPU 的 ubuntu-latest），理由见 .github/workflows/ci.yml。
addopts = -q --tb=short --strict-markers -n 6
filterwarnings =
    ignore::DeprecationWarning
