[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# -n 6（xdist 并行）：每 worker 独立库。
#
# **当前实测**（2026-10-22，10 核本机，2500+ 条用例）：
#   串行 ~5 分钟 -> 并行 **60~80 秒**。
# 历史上的「178s -> 26s」是 2026-10-13 的数：那会儿用例只有一千条上下，
# 而那 26 秒里还有一大截是「最慢那一条」撑出来的（插件升级用例要 57 秒）。
# 用例长到两千多条、且那条用例也修好之后，26 秒这个数不再成立 ——
# 现在的基线是 **60~80 秒**，见 ARCHITECTURE.md「跑得快一点」。
#
# 默认 6 而不是 -n auto：本机 10 核，实测加到 8/10 并没有更快 ——
# 瓶颈早已不在 CPU（在 PostgreSQL 的往返与 fsync 上），再加 worker 只是互相抢。
# 要跑串行（调试单条用例时）用 `-p no:xdist` 或 `-n 0`。
# CI 在命令行上覆盖成 -n 3（4 vCPU 的 ubuntu-latest），理由见 .github/workflows/ci.yml。
#
# **日常开发不要跑全量**：用 `python scripts/test_changed.py`，
# 它按真实导入关系算出「你这次改动影响哪些用例」，通常只有全量的几十分之一。
addopts = -q --tb=short --strict-markers -n 6
filterwarnings =
    ignore::DeprecationWarning
