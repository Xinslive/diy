# 工程基线 CI（P1-25）。
#
# **这份文件存在的理由。** 在它之前，仓库里没有任何机器执行的检查：没有
# .github/，没有 .pre-commit-config.yaml，没有 Makefile，没有 ruff/flake8/mypy
# 配置；46 个提交全绿**只源于作者自觉**。最直接的后果是
# ``backend/tests/conftest.py`` 里那句 ``DROP SCHEMA public CASCADE`` 和
# ``tests/test_test_db_guardrail.py`` 的整套测试库护栏 —— **删掉它们不会让任何
# 流水线变红**。护栏写了等于没写。
#
# **所以这里有一条和「跑测试」同等重要的规则：护栏必须真的被执行。**
# 下面有三道专门的闸在盯这件事：
#   1. backend job 里 pytest 是**全量**跑的，没有任何 -k / -m / --ignore；
#   2. 「护栏必须真的被执行」这一步显式断言护栏用例是 PASSED 而不是 SKIPPED；
#   3. 「用例数下限」这一步断言收集到的用例数不低于 2000 ——
#      （2026-10-23 实测 2724 条；这个下限是**实测值再往下留一截**，
#      不是随手写的整数 —— 以前写 900，而实数已经涨到 2169，于是这道闸
#      只及实数的四成，把范围收窄一半都不会触发。现在跟住了实数。）
#      以后谁想用 -k 悄悄把范围收窄，这一步会先红。
# 想改这三处，请连带在 PR 描述里说清楚理由。
#
# 七条 job：
#   docs             —— 架构文档：目录锚点（真 github-slugger）+ 段号引用契约
#   backend          —— 全量 pytest（PostgreSQL 服务 + 真实 pg_dump/psql）
#   frontend         —— node --test 与 vite build
#   docker           —— 镜像必须真的构建得出来，且 alembic.ini / migrations/ 在镜像里
#   deploy           —— 发布脚本沙箱演练（deploy/tests/test_deploy.sh）
#   plugin-browser   —— 生产构建/CSP、签名安装、两 worker 重启、用户授权闭环
#   build-artifacts  —— 出部署产物；依赖 backend、frontend、plugin-browser 全部成功

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# 取消同一个 ref 上上一轮的旧运行：提交越快越省算力，也不会让旧结果盖住新结果
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- 文档校验
  # 放在最前面：它跑得最快，失败也最容易看懂。
  #
  # **这道 job 守的是文档的「可导航性」和「引用契约」，两件都是静默失效。**
  #
  # ① 目录锚点：架构文档 8000 多行，目录是唯一的入口；锚点一旦对不上，
  #    目录看着完全正常，点进去却落到页首 —— 而且没有任何报错会响。
  #    锚点由 github-slugger 算（和 GitHub 渲染时同一套规则），
  #    **不自己复刻一份实现**：复刻过的两份已经证明会和真实行为对不上。
  #
  # ② 段号引用契约：章节号不是装饰，是**引用契约**（代码、脚本、部署文档里
  #    按 `§11.7` 这样指认章节）。锚点断了会有人发现，**编号被换给别的章节
  #    不会** —— 引用照样「解析得到」，点过去看到的是另一件事。
  #    实测踩过两个：同一个编号指向两个标题；「见 §11.13.4」指不到任何东西。
  #    所以除了跑闸门，还要跑闸门自己的反向测试 —— 只会通过的闸门等于没有闸门。
  docs:
    name: 架构文档目录锚点与段号契约
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: 装锚点计算依赖
        run: npm --prefix tools/archdoc-toc ci

      - name: 目录锚点必须全部命中
        run: node tools/archdoc-toc.mjs

      - name: 段号引用契约必须成立
        run: node tools/archdoc-refs.mjs

      - name: 段号契约闸门的反向测试（证明闸门真能拦住）
        run: node --test tools/archdoc-refs.test.mjs

  # ------------------------------------------------------------------ 后端
  backend:
    name: 后端全量测试
    runs-on: ubuntu-latest

    # 测试套件要一个真的 PostgreSQL：conftest 用迁移建库，
    # 并且有一批用例直接写 SQL 验触发器/约束 —— 用 sqlite 跑等于没跑。
    services:
      postgres:
        image: postgres:16
        env:
          # 用户名/库名沿用本地开发习惯，见 .env.example
          POSTGRES_USER: cwq
          POSTGRES_PASSWORD: cwq123
          POSTGRES_DB: cwq
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U cwq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # 库名带 _test —— conftest 的护栏**要求**这个名字，否则拒绝启动。
      # 主机写 127.0.0.1：护栏对非本地主机还会要求 CWQ_ALLOW_REMOTE_TEST_DB=1，
      # 那是给「测试库真的在远端」的场景准备的，CI 里用不着。
      # **不要为了图省事把 _test 去掉或去削弱 conftest 里的护栏。**
      CWQ_TEST_DATABASE_URL: postgresql+psycopg://cwq:cwq123@127.0.0.1:5432/cwq_test
      # 要求 pg_dump/psql 必须存在（见 tests/test_db_backup_restore.py）：
      # 备份/恢复是系统唯一的退路，这条路径不许在 CI 里悄悄被 skip 掉。
      CWQ_REQUIRE_PG_CLIENT: '1'

    steps:
      # ------------------------------------------------------------------------
      # **所有 action 都 pin 到 commit SHA**（2026-10-20 补）
      # ------------------------------------------------------------------------
      # 标签（@v4 / @v5）指向的是**可变引用**：仓库可以把 v4 重新指向另一个
      # commit，于是「昨天还干净的 action」今天就能在流水线里跑完全不同的代码
      # —— 而流水线里跑的是有 token 权限的代码。pin 到 SHA 之后，那段代码就
      # 冻结了；要升级就改 SHA（并写清版本）。
      #
      # 括号里是 pin 住的版本号，方便下次升级时对照。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 浅克隆：CI 用不到历史，而完整克隆在这个仓库上是几十兆的浪费。
          # persist-credentials 设 false：checkout 完就把 token 从 git config
          # 里拿掉 —— 后面任何一步（跑测试、跑脚本）都不该带着这个权限。
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # 与 backend/Dockerfile 和本地 .venv 一致（3.11）
          python-version: '3.11'

      - name: 装 PostgreSQL 客户端（版本必须与服务端一致）
        # 备份/恢复测试要真的调 pg_dump 和 psql。GitHub runner 镜像里不保证有，
        # 所以显式装 —— 靠「镜像里碰巧有」的话，某天 runner 换镜像就静默 skip 了。
        #
        # **版本必须钉死成与服务端同一个主版本（16）。**
        #
        # 原来装的是不带版本号的 ``postgresql-client``，装到哪个版本取决于
        # **发行版源里现在是什么**。ubuntu-latest 在 2026-10-19 迁到 Ubuntu 26
        # 之后，源里的默认客户端升到了 17/18，而本 workflow 的服务端是
        # ``postgres:16`` —— 于是 pg_dump 18 生成的 dump 里带了
        # ``SET transaction_timeout = 0;``（transaction_timeout 是 PG 17 才有的
        # 参数），PG 16 服务端不认，恢复直接失败。
        #
        # 失败形态特别隐蔽：``db_backup.py`` 的恢复带 ``--single-transaction``
        # 与 ``ON_ERROR_STOP=1``，那一条 SET 会让**整份 dump 回滚、一张表都
        # 不恢复**，而退出码只有 3。2026-10-23 那次 CI 红的就是这个
        # （backend/tests/test_db_backup_restore.py）。
        #
        # 这不是「凑合能用」的问题：pg_dump 官方明说「不保证它的输出能装进
        # 旧主版本的服务器」。所以**客户端与服务端同主版本**是硬要求，
        # 不是偏好。
        #
        # 用 PGDG 官方源装指定主版本，并**核对装出来的确实是 16** ——
        # 钉版本这件事本身也要有断言，否则哪天源里没有 16.x 了，
        # apt 会静默装回默认版本，问题原地复现。
        #
        # 但**装上不等于用上**：runner 镜像自带 PostgreSQL 客户端 18
        # （ubuntu-latest 迁到 Ubuntu 26 之后，/usr/bin/pg_dump 是
        # pg_wrapper，指向**最新装上的那个**），apt 装出来的 16 在
        # /usr/lib/postgresql/16/bin —— 不在 PATH 上。不把它顶到 PATH
        # 最前面，断言查的是 18、后面的备份/恢复测试用的也是 18。
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg

          # PGDG 官方源的签名公钥（与 nginx 那一步同一套做法：指纹钉死）
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc             | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          ALLOWED="B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8"
          FPRS=$(gpg --show-keys --with-colons /usr/share/keyrings/pgdg.gpg                  | awk -F: '/^fpr:/{print $10}')
          echo "PGDG 公钥指纹：${FPRS}"
          MATCHED=0
          for f in ${FPRS}; do
            for a in ${ALLOWED}; do
              if [ "$f" = "$a" ]; then MATCHED=1; fi
            done
          done
          if [ "$MATCHED" != "1" ]; then
            echo "::error::PGDG 签名公钥指纹不在允许清单里（官方轮换了密钥？）—— 人工确认后更新 ci.yml 的 ALLOWED"
            exit 1
          fi

          . /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main"             | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

          # **把 16 顶到 PATH 最前面。**
          #
          # 2026-10-23 那次 CI 红的就是这里：镜像自带的 pg_dump 18.6 排在
          # PATH 前面，断言查到 18 直接 exit 1，pytest 根本没跑。
          # 更要命的是「就算断言松了」的情形 —— 备份/恢复测试会调 18 生成
          # 的 dump，PG 16 服务端不认里面的版本特有参数。
          #
          # $GITHUB_PATH 对**后续步骤**也生效（会被前置到 PATH），所以
          # 后面的全量 pytest 调到的也是这个 16 —— 这才是「钉版本」的
          # 真正含义：不是装上，是**用上**。
          PG16_BIN="/usr/lib/postgresql/16/bin"
          test -x "$PG16_BIN/pg_dump" || {
            echo "::error::装完 postgresql-client-16 仍找不到 $PG16_BIN/pg_dump —— 客户端目录布局变了？"
            exit 1
          }
          echo "$PG16_BIN" >> "$GITHUB_PATH"
          export PATH="$PG16_BIN:${PATH}"

          # **断言装出来的确实是 16** —— 钉版本这件事本身也要有断言。
          # 源里没有 16.x 时 apt 会报错；这里再查一遍版本号，是防
          # 「apt 装了别的东西」与「PATH 上还有别的 pg_dump」两种情况。
          # 现在断言查的是**真正会被调用**的那个 pg_dump。
          command -v pg_dump
          command -v psql
          pg_dump --version
          psql --version
          pg_dump --version | grep -qE " 16\." || {
            echo "::error::pg_dump 不是 16.x —— 与 postgres:16 服务端不同主版本，转储会带出版本特有参数"
            exit 1
          }
          psql --version | grep -qE " 16\." || {
            echo "::error::psql 不是 16.x —— 与 postgres:16 服务端不同主版本"
            exit 1
          }

      - name: 装锁定版本的依赖
        working-directory: backend
        # 装 requirements-dev.lock（逐包定版 + **逐包哈希**），不是 requirements-dev.txt。
        # 这样「CI 跑测试的那套依赖」和「本地跑测试的那套依赖」逐包相同。
        #
        # **--require-hashes 是这道闸的一半**（2026-10-20 补）：锁文件里的
        # 每一行都带 sha256，装的时候必须逐个核对 —— 对不上就失败。
        # 以前锁文件零哈希，于是同一个版本号的任何 wheel/sdist 都能装上，
        # 镜像站还可能就地重打包：供应链上没有第二道闸。
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      - name: 全量 pytest（不加 -k，不加 -m，不跳过任何用例）
        working-directory: backend
        shell: bash
        # -n 3 覆盖 pytest.ini 里的 -n 6。两个原因：
        #   * pytest.ini 的 6 是按**本机 10 核**调出来的，它的注释里明写「8/10
        #     实测反而更慢」—— 因为用例大量走磁盘和 PostgreSQL，瓶颈是 IO。
        #     CI 跑在 ubuntu-latest（4 vCPU）上，照抄 6 只会让 6 个 worker 互相
        #     抢那 4 个核。给 3 是**略低于核数**，留一个核给 PostgreSQL 服务容器。
        #   * 刻意**不用 -n auto**：那条「IO 瓶颈」的结论是在 10 核机上测出来的，
        #     4 核机上未必成立，而 auto 会让并行度跟着 runner 的规格漂 ——
        #     同一个 commit 在不同 runner 上跑出不同的并行度，没法比较。
        #     命令行参数优先级高于 pytest.ini 的 addopts，所以这里的 3 会生效。
        #
        # **--cov=app 是覆盖率门槛那道闸的数据来源**（见下一步）。
        # 它测的是 app/（生产代码），不含 tests/ 与 scripts/。
        run: |
          set -euo pipefail
          # tee 到文件：下一步的护栏校验解析这份报告，而不是重跑一遍护栏。
          # set -o pipefail 保证 pytest 失败时这一步照样失败（tee 自己是 0）。
          python -m pytest -rA -n 3 \
            --cov=app --cov-report=xml:coverage.xml --cov-report=term \
            2>&1 | tee pytest-report.txt

      - name: 护栏测试必须真的被执行（读上面那次全量的报告，不重跑）
        working-directory: backend
        shell: bash
        # 这一步是整个 workflow 的重点。上面那次全量跑里如果有人加了
        # `-k "not guardrail"` 或者给护栏打了 skip mark，pytest 依然会全绿 ——
        # 而护栏恰恰是最容易被「静默绕过」的那部分。
        #
        # **为什么不自己再跑一遍**（原来这里是另起一个 pytest 进程跑这两个文件）：
        # tests/conftest.py 的 _test_database 是 session 级夹具，每个 pytest
        # 进程启动都会做一次 CREATE DATABASE + DROP SCHEMA public CASCADE +
        # 跑完整条迁移链。全量跑一次 = 6 套（-n 6，worker 各自建库），护栏再跑
        # 一遍 = 第 7 套。护栏那两条已经在第 95 行那次全量里跑过了 —— 同一批
        # 用例同一套迁移，白建一次库、白跑一遍迁移链。
        #
        # 现在改成解析上一步 `-rA` 已经打印出来的 short test summary。
        # **全程 fail-closed**，五条退出条件逐条都验过：
        #   1. 报告文件不存在（上一步没落盘）
        #   2. 报告里找不到 short test summary 段（截断 / 格式变了）
        #   3. 某个护栏文件一条 PASSED 都没有（被人用 -k 收窄了范围）
        #   4. 某个护栏文件 PASSED 少于下限 3 条
        #   5. 护栏出现任何非 PASSED 状态（FAILED/ERROR/SKIPPED/**XFAIL/XPASS**）
        # 宁可误报红，也不放过「护栏其实没跑」。比原来更严的一处是第 5 条：
        # 原来只挡 SKIPPED，现在把 xfail 也算失败 —— 给护栏打 xfail 正是不该
        # 悄悄发生的那类改动，它必须留在一张被人看见的 PR 上。
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          REPORT = pathlib.Path("pytest-report.txt")
          GUARDRAILS = ("tests/test_test_db_guardrail.py", "tests/test_migration_guardrails.py")
          MIN_PASSED = 3

          def die(msg):
              print("❌ " + msg)
              sys.exit(1)

          if not REPORT.is_file():
              die(f"找不到 {REPORT} —— 上一步的全量报告没有落盘，"
                  "护栏是否真的被执行无从确认。")

          text = REPORT.read_text(encoding="utf-8", errors="replace")

          # 只解析 short test summary 段。整份报告里还有 PASSES 段和被捕获的
          # stderr，那些地方同样可能出现 PASSED/FAILED 字样 —— 全文件 grep 会误判。
          idx = text.find("short test summary info")
          if idx < 0:
              die(f"{REPORT} 里找不到 short test summary 段 —— "
                  "报告被截断或 pytest 输出格式变了，不能靠猜。")
          summary = []
          for line in text[idx:].splitlines():
              if re.match(r"^=+ .* =+$", line):
                  break                       # 进入下一段，停止收集
              summary.append(line)

          # 形如：PASSED tests/test_test_db_guardrail.py::test_开发库名被拦下
          status_re = re.compile(
              r"^(PASSED|FAILED|ERROR|SKIPPED|XFAIL|XPASS)\s+(\S+?\.py)(?:::|$)")

          counts = {g: {} for g in GUARDRAILS}
          for line in summary:
              m = status_re.match(line.strip())
              if not m:
                  continue
              status, path = m.group(1), m.group(2)
              for g in GUARDRAILS:
                  if path == g or path.endswith("/" + g):
                      counts[g][status] = counts[g].get(status, 0) + 1

          problems = []
          for g in GUARDRAILS:
              c = counts[g]
              passed = c.get("PASSED", 0)
              others = {k: v for k, v in c.items() if k != "PASSED"}
              if passed == 0:
                  problems.append(f"{g}：报告里一条 PASSED 都没有"
                                  f"（该文件的状态统计：{c or '完全没出现'}）"
                                  "—— 护栏等于没上锁")
              elif passed < MIN_PASSED:
                  problems.append(f"{g}：只跑出 {passed} 条 PASSED，"
                                  f"下限是 {MIN_PASSED} 条")
              for k, v in sorted(others.items()):
                  problems.append(f"{g}：有 {v} 条 {k} —— 护栏必须真的 PASSED，"
                                  "删掉或跳过护栏不该让流水线变绿")
          if problems:
              die("；".join(problems))

          print("✅ 护栏用例真的执行了：" + "；".join(
              f"{g} {counts[g]['PASSED']} 条 PASSED" for g in GUARDRAILS))
          PY

      - name: 覆盖率门槛（不许低于基线）
        working-directory: backend
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          # **下限 88%**：基线是 2026-10-20 实测的 **89.6%**
          # （`pytest --cov=app`：app/ 共 14656 行、覆盖 13135 行）。
          # 取 88% 是给正常波动留 1.6 个点：新写的代码暂时没配套用例、
          # 平台差异带来的行覆盖抖动 —— 这些都不该让流水线红。
          #
          # **为什么不直接卡基线**：卡死基线会让「先写实现、后补用例」的
          # 正常节奏变成红灯，而红灯会被人用「把下限调低」来消掉 ——
          # 那就把这道闸本身废掉了。88% 仍然远高于「没有闸」，且任何
          # 大幅删测试的行为都会被它抓住（删 200 条用例 ≈ 掉 1 个点以上）。
          FLOOR = 88.0

          REPORT = pathlib.Path("coverage.xml")
          if not REPORT.is_file():
              print("❌ 找不到 coverage.xml —— 上一步的覆盖率数据没落盘，"
                    "这道闸无从判断（不能当成通过）。")
              sys.exit(1)

          root = ET.parse(REPORT).getroot()
          # coverage 的 XML 有两种写法：行覆盖率是根元素的属性
          # （coverage 7.x 的默认），旧格式里是 <coverage><line-rate/></coverage>
          # 的子元素。两种都认，但**都认不到就当失败**（不能靠猜）。
          rate = root.get("line-rate")
          if rate is None:
              node = root.find("./line-rate")
              rate = node.get("rate") if node is not None else None
          if rate is None:
              print("❌ coverage.xml 里找不到 line-rate —— 格式不对，不能靠猜。")
              sys.exit(1)
          pct = float(rate) * 100.0
          print(f"app/ 的行覆盖率：{pct:.2f}%（下限 {FLOOR}%）")
          if pct < FLOOR:
              print(f"❌ 覆盖率 {pct:.2f}% 低于下限 {FLOOR}% —— "
                    "新增的代码没有配套用例？")
              sys.exit(1)
          print("✅ 覆盖率不低于下限")
          PY

      - name: 用例数下限（防止有人用 -k 把范围悄悄收窄）
        working-directory: backend
        run: |
          set -euo pipefail
          n=$(python -m pytest --collect-only 2>&1 | sed -nE 's/^([0-9]+) tests collected.*/\1/p' | tail -1)
          echo "收集到 ${n:-0} 条用例"
          # 下限 2000（2026-10-20 实测 2169 条）。以前是 900、注释写「当前约
          # 960」—— 那时确实有 960 条，但后来一路涨到 2169，下限没跟着抬，
          # 于是这道闸**只及实数的四成**：把范围收窄一半都不会触发。
          # 要往下调，先想清楚是不是在拿 CI 换绿灯。
          if [ -z "${n:-}" ] || [ "$n" -lt 2000 ]; then
            echo "❌ 只收集到 ${n:-0} 条用例（下限 2000）—— 测试范围被收窄了？"
            exit 1
          fi

      - name: §7 路线图 50 项终审（退出码就是结论）
        working-directory: .
        shell: bash
        # **为什么这道闸必须真的执行。** 2026-10-25 的一轮独立复核指出：
        # 这个脚本原来结尾无条件 ``sys.exit(0)`` —— 于是 50 项全 FAIL 时它
        # 照样返回 0，**当不了闸门**（只能给人看）。退出码已经改成
        # 「有项目 FAIL ⇒ 1」，这里把它接进流水线，结论才有人盯。
        #
        # 它是**纯标准库**脚本（只读仓库里的源码、用正则找判据），不需要
        # 数据库、不需要装依赖 —— 所以放在 backend job 末尾当一步，
        # 而不是新开一个 job（那要多花一份 runner 的启动时间）。
        #
        # 判据只认代码、不认注释：每一项都要在源码里找到可复现的证据，
        # 找不到就是 FAIL。所以它同时也是「别把修复删了」的回归闸。
        run: |
          set -euo pipefail
          python3 tools/audit_roadmap_check.py

  # ------------------------------------------------------------------ 前端
  frontend:
    name: 前端测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # CI 固定在 LTS 上，不追开发机的新版本 —— 流水线要的是可复现。
          # 本地开发机跑的是 Node 26。
          #
          # **代价是两者对 `node --test` 的参数解析不一样**（这行注释原来写的是
          # 「两边都验证过」，并没有）：Node 26 能把 `tests/` 当目录展开，Node 22
          # 会把它当成一个模块去 require，直接
          # `Cannot find module '.../frontend/tests'` 而失败。
          # 所以 package.json 的 test 脚本传的是**展开后的文件列表**而不是目录
          # （见 frontend/package.json），两边行为就一致了。
          # 要改 node-version，先把这条一起改掉，别只改一半。
          node-version: '22'

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10'

      # 用 pnpm 装依赖、用 npm 跑脚本，是刻意的：
      # 仓库提交的是 pnpm-lock.yaml，没有 package-lock.json，
      # 所以 ``npm ci`` 必然失败、``npm install`` 会另生成一份锁（等于把锁作废）。
      # 而「跑测试/构建」只是执行 scripts 里的命令行，与包管理器无关，
      # 用 npm 跑正好对上 ``npm run test`` / ``npm run build`` 这两个约定。
      - name: 装依赖（按 pnpm-lock.yaml）
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 前端测试（node --test）
        working-directory: frontend
        run: npm run test

      - name: 测试文件一个都不能少被发现
        working-directory: frontend
        # P1-27 的病根就是「有 5 个用例但没有任何 runner」。
        # 现在 runner 接上了，但要防另一种形态：runner 在、却一个文件都没发现 ——
        # 那还是一片绿。
        #
        # **这道闸原来在比一个量纲不对的东西。** 它注释写的是「核对 runner
        # 发现的测试文件数与磁盘上的文件数一致」，而代码取的是 node 输出里
        # 的 ``tests N`` —— 那是**用例条数**，不是文件数。于是：
        #   * 用例数（228）≥ 文件数（75）⇒ 恒真，**少发现一个文件它也不响**；
        #   * 它唯一真正抓住的是「runner 整个没跑起来」（0 < 75）。
        # 注释说谎比没注释更坏 —— 尤其这道闸本来就是为了「别让人以为
        # 护栏在起作用」。
        #
        # **为什么不能改成数 node 报告的文件数**：本仓有 23 个测试文件会往
        # stdout 里打自己的 ``== 标题 ==`` 分隔行，那些行会**插进 node 的
        # TAP/spec 流**，把文件级的结果行冲掉 —— 实测磁盘上 75 个文件，
        # spec 输出里只剩 52 个文件级行、TAP 输出里同样只剩 52 个。
        # 从输出里数文件数因此**不可靠**，按那个数做闸会变成误报。
        #
        # 所以拆成两件事，各用各的可靠来源：
        #   ① **退出码 + 用例条数**：抓住「runner 整个没跑起来」
        #      （与 P1-27 那个形态直接对应）；
        #   ② **glob 覆盖**：直接查磁盘上有没有 ``*.test.mjs`` 落在
        #      ``tests/`` 之外 —— 那种文件 runner 的 glob **扫不到**，
        #      而且它是**不依赖任何输出解析**的可靠判断。
        # ① 抓不到「75 个文件里漏了 1 个」，这一点在这里明说，
        # 不让注释替代码吹牛。
        run: |
          set -euo pipefail
          expected=$(find tests -name '*.test.mjs' -type f | wc -l | tr -d ' ')
          out=$(npm run test 2>&1); rc=$?
          echo "$out" | tail -20
          [ "$rc" -eq 0 ] || { echo "❌ 前端测试失败（退出码 $rc）"; exit 1; }
          got=$(sed -nE 's/.*tests ([0-9]+).*/\1/p' <<<"$out" | tail -1)
          echo "磁盘上 ${expected} 个测试文件，runner 报告 ${got:-?} 条用例"
          if [ -z "${got:-}" ] || [ "$got" -lt "$expected" ]; then
            echo "❌ runner 跑出来的用例比磁盘上的测试文件还少 —— runner 整个没跑起来？"
            exit 1
          fi
          # ② glob 覆盖：tests/ 之外的测试文件 runner 扫不到。
          stray=$(find . -name '*.test.mjs' -type f \
                    -not -path './node_modules/*' -not -path './tests/*')
          if [ -n "$stray" ]; then
            echo "❌ 这些测试文件不在 tests/ 下，runner 的 glob 扫不到："
            echo "$stray"
            exit 1
          fi
          echo "✅ ${expected} 个测试文件都在 runner 的 glob 覆盖范围内"

      - name: 前端静态自检（语法，零依赖）
        working-directory: frontend
        # 这一步原来只有脚本、没人跑 —— 那样的「守卫」不是守卫。
        # 审查报告 §11.4 把 check_syntax.mjs 列成新增守卫，但它必须真的
        # 在流水线里执行，否则和 P1-27「有 5 个用例但没有任何 runner」
        # 是同一个病：文件在、没人跑、一片绿。
        #
        # 它查的是 src 与 tests 下全部 .js / .mjs 与 .vue 脚本段的语法
        # （158 个文件）。构建（vite build）只覆盖「被路由引用到」的模块，
        # 而这一层覆盖**磁盘上全部**文件 —— 没被引用的那份代码不会因为
        # 语法错误而让构建变红，但它同样是要维护的代码。
        #
        # 零依赖（只用 node），所以不会碰 pnpm-lock.yaml。
        run: npm run check

      - name: 前端构建
        working-directory: frontend
        run: npm run build

  # 独立数据库、临时签名密钥、生产构建/CSP，实际重启两 worker。
  plugin-browser:
    name: 签名插件安装与授权浏览器演练
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cwq
          POSTGRES_PASSWORD: cwq123
          POSTGRES_DB: cwq_plugin_browser_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U cwq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CWQ_PLUGIN_E2E_DATABASE_URL: postgresql+psycopg://cwq:cwq123@127.0.0.1:5432/cwq_plugin_browser_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10'
      - name: 安装锁定依赖与 Chromium
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          npm ci
          pnpm --dir frontend install --frozen-lockfile
          npx playwright install --with-deps chromium
      - name: 构建并执行真实浏览器演练
        run: |
          pnpm --dir frontend build
          python backend/scripts/plugin_e2e.py
      - name: 保留浏览器截图
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-browser-screenshots
          path: output/playwright/
          if-no-files-found: warn

  # ------------------------------------------------------------------ 镜像
  docker:
    name: 镜像能构建且迁移文件在镜像里
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 构建镜像
        # 这条路径以前**从来没被打通过**（P2-32）：镜像里没有 alembic.ini 和
        # migrations/，启动闸门必然拒绝启动，而没人构建过所以没人发现。
        # 光构建还不够 —— 下面还要断言这两个路径真的在镜像里。
        run: docker build -t cwq-api:ci backend

      - name: 镜像里必须有 alembic.ini 与 migrations/
        run: |
          set -euo pipefail
          for p in /app/alembic.ini /app/migrations /app/migrations/versions; do
            docker run --rm --entrypoint sh cwq-api:ci -c "test -e $p" \
              || { echo "❌ 镜像里缺 $p —— 启动闸门会拒绝启动（P2-32）"; exit 1; }
          done
          # 闸门本身也要能算出 head
          docker run --rm --entrypoint alembic cwq-api:ci heads \
            || { echo "❌ 镜像里 alembic 算不出 head"; exit 1; }
          docker run --rm --entrypoint python cwq-api:ci -c "import os; from pathlib import Path; from app.core.config import settings; assert os.geteuid() != 0; assert os.access('/app/data/plugins', os.W_OK); assert Path('/app/scripts/start_server.py').is_file(); assert not settings.plugin_enabled"
          docker image inspect cwq-api:ci --format '{{json .Config}}' | python -c "import json, sys; c=json.load(sys.stdin); assert '/app/data' in c['Volumes']; assert 'scripts/start_server.py' in ' '.join(c['Cmd'])"
          echo "✅ 迁移、非 root 运行目录、持久化卷与 supervisor 入口均有效"

  # ------------------------------------------------------------------ 发布脚本
  deploy:
    name: 发布脚本沙箱演练
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # deploy.sh 是 bash 脚本，用假的 git/pip/pytest/pnpm/systemctl/curl
      # 在临时目录里真跑一遍再断言它做了什么。这条测试里有一条 assert_ran
      # 守卫，专门防「脚本压根没跑起来却一片绿」。
      - name: 跑沙箱演练
        run: bash deploy/tests/test_deploy.sh

      # ------------------------------------------------------------------------
      # nginx 配置校验：**真的跑一次 nginx -t**
      # ------------------------------------------------------------------------
      # 为什么必须装 nginx：限流开关以前只实现了一半（宝塔形态缺 http 级
      # 的 limit_req_zone 定义），而那种配置**只有真的 nginx -t 才看得出来**
      # —— 它报 unknown limit_req_zone，运维按文档启用限流就会 reload 失败。
      # 静态检查能发现「引用了没定义的 zone」，但真正决定成败的是 nginx 自己。
      #
      # **版本必须是 >= 1.25.1，而且必须是与生产同一条版本线的 nginx。**
      # 仓库的配置里写的是 ``http2 on;`` —— 这个独立指令 1.25.1 才引入
      # （1.25.1 之前只有 ``listen 443 ssl http2`` 老写法，老写法 1.25.1 起
      # 弃用、1.27 起移除）。而 Ubuntu 24.04 的 apt nginx 是 **1.24.0**：
      # 装它等于拿一把版本不对的尺子量配置，nginx -t 报的
      # ``unknown directive "http2"`` 与配置本身无关 —— 2026-10-21 的 CI
      # 就是这么红的（5 条断言全红，而同一份配置在生产机的 nginx 1.31.3
      # 上加载正常）。
      #
      # 所以这里装 **nginx.org 官方源的 mainline**（生产机跑的 1.31.3 就是
      # mainline），并且把签名公钥的指纹钉死 —— 供应链上多一道核验，
      # 与本仓库「action 一律 pin SHA、依赖一律 --require-hashes」的规矩
      # 是同一件事。指纹不匹配就**直接失败**，不许「先跑着看看」。
      - name: 装 nginx（限流开关必须真的能过 nginx -t）
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl gnupg ca-certificates
          curl -fsSL https://nginx.org/keys/nginx_signing.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/nginx-archive-keyring.gpg
          # nginx 官方 keyring 里现有三把签名密钥（官方轮换过两次）。
          # **至少一把要在清单里**；官方将来再加一把时，这一步会红 ——
          # 那时要人工确认新指纹后更新这里，而不是把检查删掉。
          ALLOWED="8540A6F18833A80E9C1653A42FD21310B49F6B46 573BFD6B3D8FBC641079A6ABABF5BD827BD9BF62 9E9BE90EACBCDE69FE9B204CBCDCD8A38D88A2B3"
          FPRS=$(gpg --show-keys --with-colons /usr/share/keyrings/nginx-archive-keyring.gpg \
                 | awk -F: '/^fpr:/{print $10}')
          echo "nginx 公钥指纹：${FPRS}"
          MATCHED=0
          for f in ${FPRS}; do
            for a in ${ALLOWED}; do
              if [ "$f" = "$a" ]; then MATCHED=1; fi
            done
          done
          if [ "$MATCHED" != "1" ]; then
            echo "::error::nginx 签名公钥指纹不在允许清单里（官方轮换了密钥？）—— 人工确认后更新 ci.yml 的 ALLOWED"
            exit 1
          fi
          echo "deb [signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg] https://nginx.org/packages/mainline/ubuntu noble nginx" \
            | sudo tee /etc/apt/sources.list.d/nginx.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y nginx
          nginx -v
          # 版本不够就直接红：配置用了 http2 on;，旧 nginx 根本加载不了
          V=$(nginx -v 2>&1 | sed -n 's#.*nginx/\([0-9][0-9.]*\).*#\1#p')
          LOWEST=$(printf '%s\n' 1.25.1 "$V" | sort -V | sed -n '1p')
          if [ "$LOWEST" != "1.25.1" ]; then
            echo "::error::nginx 版本 $V < 1.25.1（这份配置用了 http2 on;）"
            exit 1
          fi

      - name: nginx 配置校验（结构 + 真的 nginx -t）
        # 这个脚本会：把两份配置改写成自包含的临时配置（证书/日志/include
        # 目录都指到临时目录）→ **按文档建出限流那两个文件** → nginx -t。
        # 「按文档启用限流」这条路径本身必须能过。
        # --require-nginx：没装 nginx 就判失败 —— 否则这道闸会「跳过 → 全绿」，
        # 变成一道什么也没验的假闸。
        #
        # **必须 sudo**：nginx -t 要打开默认错误日志（/var/log/nginx/error.log）
        # 并真的 bind() 配置里的 80/443。以 runner 身份跑的话，nginx 报的是
        # 「could not open error log file」与「bind() failed (Permission denied)」
        # —— 语法明明 ok，挂在的是权限。2026-10-21 的 CI 就是这么红了几条。
        run: sudo python3 deploy/tests/nginx_conf_check.py --require-nginx

  # ------------------------------------------------------------------ 构建产物
  #
  # **这条 job 存在的理由：让生产机不必再当构建机。**
  #
  # 原来的 deploy.sh 在生产机上跑全量 pytest（-n 6，6 个并行 worker 各自
  # 建独立 PG 库）加 pnpm install 加 vite build。那是生产机上最重的一步 ——
  # 比运行时重得多，且要求生产机常驻 Node.js / pnpm / pytest 三套工具链，
  # 只为了发一次版。
  #
  # 改成「CI 出产物、生产机只取产物重启」之后，生产机不再需要这三样，
  # 发版尖峰也随之消失。
  #
  # **「测试闸门」没有被削弱，只是换了位置。** deploy.sh 原来的第一条铁律是
  # 「先跑测试再切流量」。现在这个闸门由 `needs:` 承担：本 job 必须等
  # backend、frontend 与 plugin-browser 都成功才会跑，所以**产物存在即代表后端全量
  # pytest、前端测试/构建和真实插件浏览器演练都过了**。生产机「能不能取到产物」就是新的闸门 ——
  # 取不到就不会重启服务。
  #
  # 护栏校验（护栏必须真的被执行、用例数下限，见 backend job 里的说明）
  # **在 backend job 里生效**，而本 job `needs: backend`，所以它同样是上线
  # 前置条件，不是在本地跑跑就算的那道闸。
  build-artifacts:
    name: 构建可部署产物
    runs-on: ubuntu-latest
    needs: [backend, frontend, plugin-browser]

    # **services 必须挂在 job 上，不能挂在 step 上。**
    #
    # 它原先写在下面「验证 schema 自洽」那个 step 里面，而 step 的 schema 里
    # 根本没有 services 这个键。GitHub 校验工作流文件时不认，于是**整个工作流
    # 被判为非法**：一次 job 都不会创建，运行直接失败，而且界面只给一句
    # "This run likely failed because of a workflow file issue" —— 没有任何
    # 行号、没有任何原因。
    #
    # 后果不是「这一步没跑」，而是**整条流水线自 2026-10-13 起从未创建过任何一个
    # job**：backend / frontend / docker / deploy / build-artifacts 一条都没跑过。
    # 顺带也意味着 build-artifacts 从没产出过产物，deploy.sh 取产物的第一道闸门
    # 在此之前根本不可能通过。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cwq
          POSTGRES_PASSWORD: cwq123
          POSTGRES_DB: cwq_artifacts
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cwq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'   # 与 Dockerfile / systemd / CI backend 一致

      - name: 按锁定版本装运行时依赖（不是 requirements-dev.lock）
        working-directory: backend
        # **只装 requirements.lock**：生产机拿到这个产物后装的就是同一套。
        # 这里若用了 dev 锁（带 pytest / httpx），产物里就会混入生产用不到的
        # 东西，而「产物里跑的是哪一版」又变成看构建那天的心情。
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: 验证 schema 自洽（空库跑完整迁移链）
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://cwq:cwq123@127.0.0.1:5432/cwq_artifacts
        # 产物里带了 migrations/ 却不保证它能 upgrade，生产机上就是
        # 「代码已切、schema 没升」—— 服务起不来，或者更糟：起得来但读的是旧表。
        # 这里在 CI 里先跑一遍，失败就不该有产物。
        run: |
          set -euo pipefail
          python -m alembic upgrade head
          echo "schema 版本：$(python -m alembic current | tail -1)"

      # 与 frontend job **完全同一套** Node/pnpm 接入。
      #
      # 原来这里是裸的 ``corepack enable``：package.json 里没有 packageManager
      # 字段，corepack 就按「它当前认为的最新版」装 pnpm —— 实测当天给的是
      # 12.14.0，而 frontend job 用 pnpm/action-setup 钉的是 10.x。**同一个
      # workflow 里两个 job 用了两个不同的 pnpm**，于是 frontend 验过的构建，
      # 产物 job 未必跑得通；而 corepack 装哪个版本还会随时间漂移。
      #
      # 换成显式 setup 后两边锁死在同一个大版本，构建产物与被验证过的行为一致。
      # 要改版本，这里和 frontend job 的 pnpm/action-setup 一起改。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10'

      - name: 构建前端
        working-directory: frontend
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --silent
          pnpm run build

      - name: 打包产物
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::12}"
          OUT="dist-artifacts"
          mkdir -p "$OUT"

          # 后端：源码 + 运行时锁 + 迁移文件。**不含** tests / .venv /
          # requirements-dev.* —— 生产机不需要测试框架（那是「机器上装的
          # 东西到底是给谁用的」说不清的老问题）。
          tar -czf "$OUT/cwq-backend-${SHA}.tar.gz" \
            -C backend \
            --exclude='tests' --exclude='.venv' --exclude='__pycache__' \
            --exclude='*.pyc' --exclude='logs' \
            app scripts migrations alembic.ini requirements.lock pytest.ini

          # 前端：只有产物目录，不含 src / node_modules
          tar -czf "$OUT/cwq-frontend-${SHA}.tar.gz" -C frontend dist

          # 发布脚本自己也进产物。
          #
          # **为什么。** 以前 deploy/ 不在产物里，于是生产机上跑的那份脚本是
          # **人工 scp 过去的副本** —— CI 的「发布脚本沙箱演练」验的是仓库里
          # 那份，生产机跑的是另一份，两边会漂移。漂移的表现不是报错，而是
          # **脚本少做的事照样显示成功**（真实案例：生产机 $APP/deploy 是
          # 2026-10-24 的旧副本，logrotate/ 里没有 cwq-backup，新规则被遮蔽）。
          #
          # 进了产物之后，生产机跑的脚本就是 CI 验过的那一份；deploy.sh 自己
          # 还会比对「我正在跑的」与「产物里那份」的 sha256，不一致就中止
          # （见 deploy.sh 的 verify_release_script）。
          tar -czf "$OUT/cwq-deploy-${SHA}.tar.gz" -C . \
            --exclude='__pycache__' --exclude='*.pyc' deploy

          # 清单：版本 + 构件名。生产机据此确认「拿到的是 CI 出品的那一份」。
          {
            echo "sha=${SHA}"
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF_NAME}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "backend=cwq-backend-${SHA}.tar.gz"
            echo "frontend=cwq-frontend-${SHA}.tar.gz"
            echo "deploy=cwq-deploy-${SHA}.tar.gz"
          } > "$OUT/manifest.txt"
          ( cd "$OUT" && sha256sum ./*.tar.gz > SHA256SUMS )

          cat "$OUT/manifest.txt"
          ls -lh "$OUT"

      - name: 上传产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cwq-deploy-${{ github.sha }}
          path: dist-artifacts/
          retention-days: 30
          if-no-files-found: error   # 产物没生成出来就不许「成功」