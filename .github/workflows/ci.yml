# 工程基线 CI（P1-25）。
#
# **这份文件存在的理由。** 在它之前，仓库里没有任何机器执行的检查：没有
# .github/，没有 .pre-commit-config.yaml，没有 Makefile，没有 ruff/flake8/mypy
# 配置；46 个提交全绿**只源于作者自觉**。最直接的后果是
# ``backend/tests/conftest.py`` 里那句 ``DROP SCHEMA public CASCADE`` 和
# ``tests/test_test_db_guardrail.py`` 的整套测试库护栏 —— **删掉它们不会让任何
# 流水线变红**。护栏写了等于没写。
#
# **所以这里有一条和「跑测试」同等重要的规则：护栏必须真的被执行。**
# 下面有三道专门的闸在盯这件事：
#   1. backend job 里 pytest 是**全量**跑的，没有任何 -k / -m / --ignore；
#   2. 「护栏必须真的被执行」这一步显式断言护栏用例是 PASSED 而不是 SKIPPED；
#   3. 「用例数下限」这一步断言收集到的用例数不低于 900 ——
#      以后谁想用 -k 悄悄把范围收窄，这一步会先红。
# 想改这三处，请连带在 PR 描述里说清楚理由。
#
# 五条 job：
#   backend          —— 全量 pytest（PostgreSQL 服务 + 真实 pg_dump/psql）
#   frontend         —— node --test 与 vite build
#   docker           —— 镜像必须真的构建得出来，且 alembic.ini / migrations/ 在镜像里
#   deploy           —— 发布脚本沙箱演练（deploy/tests/test_deploy.sh）
#   build-artifacts  —— 出部署产物；needs backend+frontend，所以「产物存在」即代表
#                       后端全量测试与前端测试构建都过了（deploy.sh 的测试闸门靠它）

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# 取消同一个 ref 上上一轮的旧运行：提交越快越省算力，也不会让旧结果盖住新结果
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ 后端
  backend:
    name: 后端全量测试
    runs-on: ubuntu-latest

    # 测试套件要一个真的 PostgreSQL：conftest 用迁移建库，
    # 并且有一批用例直接写 SQL 验触发器/约束 —— 用 sqlite 跑等于没跑。
    services:
      postgres:
        image: postgres:16
        env:
          # 用户名/库名沿用本地开发习惯，见 .env.example
          POSTGRES_USER: cwq
          POSTGRES_PASSWORD: cwq123
          POSTGRES_DB: cwq
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U cwq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # 库名带 _test —— conftest 的护栏**要求**这个名字，否则拒绝启动。
      # 主机写 127.0.0.1：护栏对非本地主机还会要求 CWQ_ALLOW_REMOTE_TEST_DB=1，
      # 那是给「测试库真的在远端」的场景准备的，CI 里用不着。
      # **不要为了图省事把 _test 去掉或去削弱 conftest 里的护栏。**
      CWQ_TEST_DATABASE_URL: postgresql+psycopg://cwq:cwq123@127.0.0.1:5432/cwq_test
      # 要求 pg_dump/psql 必须存在（见 tests/test_db_backup_restore.py）：
      # 备份/恢复是系统唯一的退路，这条路径不许在 CI 里悄悄被 skip 掉。
      CWQ_REQUIRE_PG_CLIENT: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与 backend/Dockerfile 和本地 .venv 一致（3.11）
          python-version: '3.11'

      - name: 装 PostgreSQL 客户端
        # 备份/恢复测试要真的调 pg_dump 和 psql。GitHub runner 镜像里不保证有，
        # 所以显式装 —— 靠「镜像里碰巧有」的话，某天 runner 换镜像就静默 skip 了。
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pg_dump --version && psql --version

      - name: 装锁定版本的依赖
        working-directory: backend
        # 装 requirements-dev.lock（逐包定版），不是 requirements-dev.txt。
        # 这样「CI 跑测试的那套依赖」和「本地跑测试的那套依赖」逐包相同。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock

      - name: 全量 pytest（不加 -k，不加 -m，不跳过任何用例）
        working-directory: backend
        shell: bash
        # -n 3 覆盖 pytest.ini 里的 -n 6。两个原因：
        #   * pytest.ini 的 6 是按**本机 10 核**调出来的，它的注释里明写「8/10
        #     实测反而更慢」—— 因为用例大量走磁盘和 PostgreSQL，瓶颈是 IO。
        #     CI 跑在 ubuntu-latest（4 vCPU）上，照抄 6 只会让 6 个 worker 互相
        #     抢那 4 个核。给 3 是**略低于核数**，留一个核给 PostgreSQL 服务容器。
        #   * 刻意**不用 -n auto**：那条「IO 瓶颈」的结论是在 10 核机上测出来的，
        #     4 核机上未必成立，而 auto 会让并行度跟着 runner 的规格漂 ——
        #     同一个 commit 在不同 runner 上跑出不同的并行度，没法比较。
        #     命令行参数优先级高于 pytest.ini 的 addopts，所以这里的 3 会生效。
        run: |
          set -euo pipefail
          # tee 到文件：下一步的护栏校验解析这份报告，而不是重跑一遍护栏。
          # set -o pipefail 保证 pytest 失败时这一步照样失败（tee 自己是 0）。
          python -m pytest -rA -n 3 2>&1 | tee pytest-report.txt

      - name: 护栏测试必须真的被执行（读上面那次全量的报告，不重跑）
        working-directory: backend
        shell: bash
        # 这一步是整个 workflow 的重点。上面那次全量跑里如果有人加了
        # `-k "not guardrail"` 或者给护栏打了 skip mark，pytest 依然会全绿 ——
        # 而护栏恰恰是最容易被「静默绕过」的那部分。
        #
        # **为什么不自己再跑一遍**（原来这里是另起一个 pytest 进程跑这两个文件）：
        # tests/conftest.py 的 _test_database 是 session 级夹具，每个 pytest
        # 进程启动都会做一次 CREATE DATABASE + DROP SCHEMA public CASCADE +
        # 跑完整条迁移链。全量跑一次 = 6 套（-n 6，worker 各自建库），护栏再跑
        # 一遍 = 第 7 套。护栏那两条已经在第 95 行那次全量里跑过了 —— 同一批
        # 用例同一套迁移，白建一次库、白跑一遍迁移链。
        #
        # 现在改成解析上一步 `-rA` 已经打印出来的 short test summary。
        # **全程 fail-closed**，五条退出条件逐条都验过：
        #   1. 报告文件不存在（上一步没落盘）
        #   2. 报告里找不到 short test summary 段（截断 / 格式变了）
        #   3. 某个护栏文件一条 PASSED 都没有（被人用 -k 收窄了范围）
        #   4. 某个护栏文件 PASSED 少于下限 3 条
        #   5. 护栏出现任何非 PASSED 状态（FAILED/ERROR/SKIPPED/**XFAIL/XPASS**）
        # 宁可误报红，也不放过「护栏其实没跑」。比原来更严的一处是第 5 条：
        # 原来只挡 SKIPPED，现在把 xfail 也算失败 —— 给护栏打 xfail 正是不该
        # 悄悄发生的那类改动，它必须留在一张被人看见的 PR 上。
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          REPORT = pathlib.Path("pytest-report.txt")
          GUARDRAILS = ("tests/test_test_db_guardrail.py", "tests/test_migration_guardrails.py")
          MIN_PASSED = 3

          def die(msg):
              print("❌ " + msg)
              sys.exit(1)

          if not REPORT.is_file():
              die(f"找不到 {REPORT} —— 上一步的全量报告没有落盘，"
                  "护栏是否真的被执行无从确认。")

          text = REPORT.read_text(encoding="utf-8", errors="replace")

          # 只解析 short test summary 段。整份报告里还有 PASSES 段和被捕获的
          # stderr，那些地方同样可能出现 PASSED/FAILED 字样 —— 全文件 grep 会误判。
          idx = text.find("short test summary info")
          if idx < 0:
              die(f"{REPORT} 里找不到 short test summary 段 —— "
                  "报告被截断或 pytest 输出格式变了，不能靠猜。")
          summary = []
          for line in text[idx:].splitlines():
              if re.match(r"^=+ .* =+$", line):
                  break                       # 进入下一段，停止收集
              summary.append(line)

          # 形如：PASSED tests/test_test_db_guardrail.py::test_开发库名被拦下
          status_re = re.compile(
              r"^(PASSED|FAILED|ERROR|SKIPPED|XFAIL|XPASS)\s+(\S+?\.py)(?:::|$)")

          counts = {g: {} for g in GUARDRAILS}
          for line in summary:
              m = status_re.match(line.strip())
              if not m:
                  continue
              status, path = m.group(1), m.group(2)
              for g in GUARDRAILS:
                  if path == g or path.endswith("/" + g):
                      counts[g][status] = counts[g].get(status, 0) + 1

          problems = []
          for g in GUARDRAILS:
              c = counts[g]
              passed = c.get("PASSED", 0)
              others = {k: v for k, v in c.items() if k != "PASSED"}
              if passed == 0:
                  problems.append(f"{g}：报告里一条 PASSED 都没有"
                                  f"（该文件的状态统计：{c or '完全没出现'}）"
                                  "—— 护栏等于没上锁")
              elif passed < MIN_PASSED:
                  problems.append(f"{g}：只跑出 {passed} 条 PASSED，"
                                  f"下限是 {MIN_PASSED} 条")
              for k, v in sorted(others.items()):
                  problems.append(f"{g}：有 {v} 条 {k} —— 护栏必须真的 PASSED，"
                                  "删掉或跳过护栏不该让流水线变绿")
          if problems:
              die("；".join(problems))

          print("✅ 护栏用例真的执行了：" + "；".join(
              f"{g} {counts[g]['PASSED']} 条 PASSED" for g in GUARDRAILS))
          PY

      - name: 用例数下限（防止有人用 -k 把范围悄悄收窄）
        working-directory: backend
        run: |
          set -euo pipefail
          n=$(python -m pytest --collect-only 2>&1 | sed -nE 's/^([0-9]+) tests collected.*/\1/p' | tail -1)
          echo "收集到 ${n:-0} 条用例"
          # 下限 900（当前约 960）。要往下调，先想清楚是不是在拿 CI 换绿灯。
          if [ -z "${n:-}" ] || [ "$n" -lt 900 ]; then
            echo "❌ 只收集到 ${n:-0} 条用例（下限 900）—— 测试范围被收窄了？"
            exit 1
          fi

  # ------------------------------------------------------------------ 前端
  frontend:
    name: 前端测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # CI 固定在 LTS 上，不追开发机的新版本 —— 流水线要的是可复现。
          # 本地开发机跑的是 Node 26。
          #
          # **代价是两者对 `node --test` 的参数解析不一样**（这行注释原来写的是
          # 「两边都验证过」，并没有）：Node 26 能把 `tests/` 当目录展开，Node 22
          # 会把它当成一个模块去 require，直接
          # `Cannot find module '.../frontend/tests'` 而失败。
          # 所以 package.json 的 test 脚本传的是**展开后的文件列表**而不是目录
          # （见 frontend/package.json），两边行为就一致了。
          # 要改 node-version，先把这条一起改掉，别只改一半。
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      # 用 pnpm 装依赖、用 npm 跑脚本，是刻意的：
      # 仓库提交的是 pnpm-lock.yaml，没有 package-lock.json，
      # 所以 ``npm ci`` 必然失败、``npm install`` 会另生成一份锁（等于把锁作废）。
      # 而「跑测试/构建」只是执行 scripts 里的命令行，与包管理器无关，
      # 用 npm 跑正好对上 ``npm run test`` / ``npm run build`` 这两个约定。
      - name: 装依赖（按 pnpm-lock.yaml）
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 前端测试（node --test）
        working-directory: frontend
        run: npm run test

      - name: 测试文件一个都不能少被发现
        working-directory: frontend
        # P1-27 的病根就是「有 5 个用例但没有任何 runner」。
        # 现在 runner 接上了，但要防另一种形态：runner 在、却一个文件都没发现 ——
        # 那还是一片绿。先看退出码（node --test 失败会非零退出），
        # 再核对 runner 发现的测试文件数与磁盘上的文件数一致。
        run: |
          set -euo pipefail
          expected=$(ls tests/*.test.mjs | wc -l | tr -d ' ')
          out=$(npm run test 2>&1); rc=$?
          echo "$out" | tail -20
          [ "$rc" -eq 0 ] || { echo "❌ 前端测试失败（退出码 $rc）"; exit 1; }
          got=$(sed -nE 's/.*tests ([0-9]+).*/\1/p' <<<"$out" | tail -1)
          echo "磁盘上 ${expected} 个测试文件，runner 报告 ${got:-?} 个"
          if [ -z "${got:-}" ] || [ "$got" -lt "$expected" ]; then
            echo "❌ runner 发现的测试文件比磁盘上少 —— 有用例没被执行"
            exit 1
          fi

      - name: 前端构建
        working-directory: frontend
        run: npm run build

  # ------------------------------------------------------------------ 镜像
  docker:
    name: 镜像能构建且迁移文件在镜像里
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        # 这条路径以前**从来没被打通过**（P2-32）：镜像里没有 alembic.ini 和
        # migrations/，启动闸门必然拒绝启动，而没人构建过所以没人发现。
        # 光构建还不够 —— 下面还要断言这两个路径真的在镜像里。
        run: docker build -t cwq-api:ci backend

      - name: 镜像里必须有 alembic.ini 与 migrations/
        run: |
          set -euo pipefail
          for p in /app/alembic.ini /app/migrations /app/migrations/versions; do
            docker run --rm --entrypoint sh cwq-api:ci -c "test -e $p" \
              || { echo "❌ 镜像里缺 $p —— 启动闸门会拒绝启动（P2-32）"; exit 1; }
          done
          # 闸门本身也要能算出 head
          docker run --rm --entrypoint alembic cwq-api:ci heads \
            || { echo "❌ 镜像里 alembic 算不出 head"; exit 1; }
          echo "✅ 迁移文件在镜像里"

  # ------------------------------------------------------------------ 发布脚本
  deploy:
    name: 发布脚本沙箱演练
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # deploy.sh 是 bash 脚本，用假的 git/pip/pytest/pnpm/systemctl/curl
      # 在临时目录里真跑一遍再断言它做了什么。这条测试里有一条 assert_ran
      # 守卫，专门防「脚本压根没跑起来却一片绿」。
      - name: 跑沙箱演练
        run: bash deploy/tests/test_deploy.sh

  # ------------------------------------------------------------------ 构建产物
  #
  # **这条 job 存在的理由：让生产机不必再当构建机。**
  #
  # 原来的 deploy.sh 在生产机上跑全量 pytest（-n 6，6 个并行 worker 各自
  # 建独立 PG 库）加 pnpm install 加 vite build。那是生产机上最重的一步 ——
  # 比运行时重得多，且要求生产机常驻 Node.js / pnpm / pytest 三套工具链，
  # 只为了发一次版。
  #
  # 改成「CI 出产物、生产机只取产物重启」之后，生产机不再需要这三样，
  # 发版尖峰也随之消失。
  #
  # **「测试闸门」没有被削弱，只是换了位置。** deploy.sh 原来的第一条铁律是
  # 「先跑测试再切流量」。现在这个闸门由 `needs:` 承担：本 job 必须等
  # backend 与 frontend 两条 job 都成功才会跑，所以**产物存在即代表后端全量
  # pytest 与前端测试/构建都过了**。生产机「能不能取到产物」就是新的闸门 ——
  # 取不到就不会重启服务。
  #
  # 护栏校验（护栏必须真的被执行、用例数下限，见 backend job 里的说明）
  # **在 backend job 里生效**，而本 job `needs: backend`，所以它同样是上线
  # 前置条件，不是在本地跑跑就算的那道闸。
  build-artifacts:
    name: 构建可部署产物
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    # **services 必须挂在 job 上，不能挂在 step 上。**
    #
    # 它原先写在下面「验证 schema 自洽」那个 step 里面，而 step 的 schema 里
    # 根本没有 services 这个键。GitHub 校验工作流文件时不认，于是**整个工作流
    # 被判为非法**：一次 job 都不会创建，运行直接失败，而且界面只给一句
    # "This run likely failed because of a workflow file issue" —— 没有任何
    # 行号、没有任何原因。
    #
    # 后果不是「这一步没跑」，而是**整条流水线自 2026-10-13 起从未创建过任何一个
    # job**：backend / frontend / docker / deploy / build-artifacts 一条都没跑过。
    # 顺带也意味着 build-artifacts 从没产出过产物，deploy.sh 取产物的第一道闸门
    # 在此之前根本不可能通过。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cwq
          POSTGRES_PASSWORD: cwq123
          POSTGRES_DB: cwq_artifacts
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cwq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # 与 Dockerfile / systemd / CI backend 一致

      - name: 按锁定版本装运行时依赖（不是 requirements-dev.lock）
        working-directory: backend
        # **只装 requirements.lock**：生产机拿到这个产物后装的就是同一套。
        # 这里若用了 dev 锁（带 pytest / httpx），产物里就会混入生产用不到的
        # 东西，而「产物里跑的是哪一版」又变成看构建那天的心情。
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: 验证 schema 自洽（空库跑完整迁移链）
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://cwq:cwq123@127.0.0.1:5432/cwq_artifacts
        # 产物里带了 migrations/ 却不保证它能 upgrade，生产机上就是
        # 「代码已切、schema 没升」—— 服务起不来，或者更糟：起得来但读的是旧表。
        # 这里在 CI 里先跑一遍，失败就不该有产物。
        run: |
          set -euo pipefail
          python -m alembic upgrade head
          echo "schema 版本：$(python -m alembic current | tail -1)"

      # 与 frontend job **完全同一套** Node/pnpm 接入。
      #
      # 原来这里是裸的 ``corepack enable``：package.json 里没有 packageManager
      # 字段，corepack 就按「它当前认为的最新版」装 pnpm —— 实测当天给的是
      # 12.14.0，而 frontend job 用 pnpm/action-setup 钉的是 10.x。**同一个
      # workflow 里两个 job 用了两个不同的 pnpm**，于是 frontend 验过的构建，
      # 产物 job 未必跑得通；而 corepack 装哪个版本还会随时间漂移。
      #
      # 换成显式 setup 后两边锁死在同一个大版本，构建产物与被验证过的行为一致。
      # 要改版本，这里和 frontend job 的 pnpm/action-setup 一起改。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: 构建前端
        working-directory: frontend
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --silent
          pnpm run build

      - name: 打包产物
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::12}"
          OUT="dist-artifacts"
          mkdir -p "$OUT"

          # 后端：源码 + 运行时锁 + 迁移文件。**不含** tests / .venv /
          # requirements-dev.* —— 生产机不需要测试框架（那是「机器上装的
          # 东西到底是给谁用的」说不清的老问题）。
          tar -czf "$OUT/cwq-backend-${SHA}.tar.gz" \
            -C backend \
            --exclude='tests' --exclude='.venv' --exclude='__pycache__' \
            --exclude='*.pyc' --exclude='logs' \
            app scripts migrations alembic.ini requirements.lock pytest.ini

          # 前端：只有产物目录，不含 src / node_modules
          tar -czf "$OUT/cwq-frontend-${SHA}.tar.gz" -C frontend dist

          # 清单：版本 + 构件名。生产机据此确认「拿到的是 CI 出品的那一份」。
          {
            echo "sha=${SHA}"
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF_NAME}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "backend=cwq-backend-${SHA}.tar.gz"
            echo "frontend=cwq-frontend-${SHA}.tar.gz"
          } > "$OUT/manifest.txt"
          ( cd "$OUT" && sha256sum ./*.tar.gz > SHA256SUMS )

          cat "$OUT/manifest.txt"
          ls -lh "$OUT"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: cwq-deploy-${{ github.sha }}
          path: dist-artifacts/
          retention-days: 30
          if-no-files-found: error   # 产物没生成出来就不许「成功」