# ===========================================================================
# 桌面壳（tools/desktop-shell/）的 CI。
#
# **为什么单独一个 workflow，而不是在 ci.yml 里加个 job。**
#
# ci.yml 是「工程基线 CI」：后端全量 pytest、前端测试、镜像构建、发布脚本
# 沙箱演练。它全部跑在 ubuntu 上。而桌面壳的产物是 **Windows exe**，
# 只有在 windows-latest 上才打得出、才跑得动 —— 把它塞进 ci.yml 会让那套
# 「全在 Linux 上跑」的基线出现一个异类 job。所以另起一个 workflow，
# 各管各的。
#
# ---------------------------------------------------------------------------
# 两道闸，以及它们各自在防什么
# ---------------------------------------------------------------------------
#
# **闸 1：单元测试（ubuntu）**
#     测的是平台无关的纯逻辑：路径展开、浏览器发现、参数拼装、URL 校验、
#     配置解析、启动计划。跑在 Linux 上 —— 这样「改代码 → 看到红」只要
#     几十秒，不用等 Windows runner 排队。逻辑本身与平台无关，所以
#     Linux 上测出来的结论对 Windows 同样成立（真正依赖 Windows 的那部分
#     由闸 2 覆盖）。
#
# **闸 2：Windows 构建 + 真跑 exe（windows-latest）**
#     这道闸在防一件单元测试**根本测不出来**的事：PyInstaller 的失败方式
#     很安静 —— 它不报错，它产出一个「双击没反应」的 exe。
#
#     所以这里不是「编译通过就算绿」，而是**把 exe 真跑起来**，
#     用 --dry-run 让它把「打算怎么做」写成 JSON，再逐条断言：
#       · exe 是个真的 PE（MZ 头）
#       · 退出码 0、JSON 可解析
#       · 目标地址是 acct.xins.live
#       · 应用模式下参数里有 --app= 与 --user-data-dir=
#       · --no-app-mode 退回默认浏览器且参数为空
#       · --browser 显式指定时走自定义分支
#       · profile 目录是绝对路径
#       · 非 http/https 的地址被拒（退出码 2）
#     断言逻辑写在 tools/desktop-shell/smoke_test.py 里，可以本地手动跑。
#
#     闸 2 里还有**第三步**，比上面那条更靠里：
#
#     **闸 3：真 spawn（同一道 workflow 里）**
#         --dry-run 在 main() 里是**提前返回**的，压根走不到 spawn()。
#         所以上面那条全绿，并不等于「用户双击能开窗」—— 中间那一段本来
#         没有闸。闸 3 用一个「替身浏览器」真 exe 装在真实的 Edge 安装位置，
#         不带参数运行壳 exe（= 双击那一下），断言替身**真的收到了参数**。
#         断言逻辑在 tools/desktop-shell/launch_path_probe.py。
#
# ---------------------------------------------------------------------------
# action 一律 pin 到 commit SHA
# ---------------------------------------------------------------------------
# 与 ci.yml 同一条规矩。标签（@v4）指向可变引用：仓库可以把 v4 重新指向
# 另一个 commit，于是「昨天还干净的 action」今天就能跑完全不同的代码 ——
# 而流水线里跑的是有 token 权限的代码。pin 住 SHA 之后那段代码就冻结了。
# 括号里是 pin 住的版本号，升级时对照。
# ===========================================================================

name: Desktop Shell

on:
  push:
    branches: ['**']
    # **只在壳相关的文件变了才跑。**
    #
    # 这条 workflow 每跑一次要 2~4 分钟（Windows runner 冷启动 + 打包）。
    # 而 GitHub Actions 的免费额度是**按月**算的（免费账户 2,000 分钟/月）。
    # 一个「每次 push 都跑」的新 workflow 会在用户没察觉的情况下把额度吃掉 ——
    # 额度用完之后，**连主 CI 一起跑不了**（那条要 12 分钟）。
    #
    # 所以这里限定 paths：只有动了壳的代码、CI 配置、或者研究文档才触发。
    # 想要随时手动跑：workflow_dispatch。
    paths:
      - 'tools/desktop-shell/**'
      - '.github/workflows/desktop-shell.yml'
      - 'docs/Windows打包exe可行性研究.md'
  pull_request:
    paths:
      - 'tools/desktop-shell/**'
      - '.github/workflows/desktop-shell.yml'
      - 'docs/Windows打包exe可行性研究.md'
  workflow_dispatch:

# 取消同一个 ref 上上一轮的旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ 单元测试
  test:
    name: 壳的单元测试
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # 3.11 —— 与 backend/Dockerfile、ci.yml 的 backend job、systemd
          # 生产环境一致。壳本身只用标准库，理论上任何版本都行，但把版本
          # 钉死是为了让「本地跑的」和「CI 跑的」是同一个东西。
          python-version: '3.11'

      - name: 跑单元测试
        # 用 unittest 而不是 pytest：壳是零依赖工具，测试也不该拖上一个
        # pytest。`python -m unittest` 就能跑；pytest 同样能收 unittest 的
        # 用例，所以本仓库那套 pytest 也跑得动它。
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s tools/desktop-shell/tests \
            -t tools/desktop-shell/tests \
            -v

  # ------------------------------------------------------------------ Windows 构建
  build-windows:
    name: 构建 Windows exe
    runs-on: windows-latest
    needs: [test]

    # **Windows 控制台默认不是 UTF-8。**
    #
    # 第一次跑这条 workflow 时，windows-latest 上 make_icon.py 打印「✅」
    # 抛了 UnicodeEncodeError（cp1252 编不出这个字符），整条 workflow
    # 红在「生成图标」那一步。代码里已经用 force_utf8_output() 加固
    # （见 launcher.py），但这里再设一道环境变量作为双保险 ——
    # 这条 workflow 里**每一个** Python 脚本都受益，不必逐个记得加固。
    #
    # 注意：中文 Windows 默认是 cp936、PowerShell 5.1 下是 cp1252，
    # 两者都写不出 ✅ 与部分中文，所以这一道不是多余的。
    #
    # （`env:` 是 **job 级**的键，必须与 `steps:` 平级 —— 放进 steps 列表里
    # 会让整个 YAML 解析失败。）
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: 装打包依赖（定版 + 哈希锁定）
        # 按 requirements-build.lock 装 —— **哈希锁定，不只是钉版本号**。
        #
        # 仓库的规矩是「依赖一律 --require-hashes」（ci.yml 一直照做）。
        # 只钉版本号是不够的：同一个版本号的 wheel 可以被重新打包上传
        # （PyPI 不允许覆盖同名同版本的文件，但允许上传「文件名不同、
        # 内容不同」的重新打包版本，setuptools 至今还这么干）。于是
        # 「pin 了 6.22.3」并不等于「装到的是我审过的那份 6.22.3」——
        # 供应链攻击的入口正是在这里。加上哈希后 pip 会在安装前逐个核对
        # SHA-256，对不上就拒绝安装。
        #
        # --only-binary=:all: 是 --require-hashes 的必要搭配：哈希是按
        # wheel 文件本身算的，sdist 要解包后才算得出来，对不上。
        #
        # 锁文件里的哈希是按 **Windows x64 + CPython 3.11** 的 wheel 算的
        # （与上面 pin 的 python-version 一致），换平台/换小版本会直接失败 ——
        # 这是故意的：构建环境必须与被审过的那一份完全一致。
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --only-binary=:all: `
            -r tools/desktop-shell/requirements-build.lock

          # **钉版本本身也要有断言。** 锁文件装对了，不等于装的是预期的那个
          # 版本 —— 将来有人改了锁文件里的版本号并重算了哈希，这里就是
          # 最后一道拦。措辞跟 ci.yml 里「钉版本要有断言」那条一致。
          #
          # **这段是 PowerShell**（windows-latest 的默认 shell），不是 bash：
          # ``tr``、``[ "$v" != ... ]`` 在这里都不存在，用了会是「命令找不到」
          # 而不是「断言失败」—— 断言失败会红，命令找不到也会红，但错误信息
          # 会把人引到「PowerShell 坏了」而不是「版本不对」。
          python -m PyInstaller --version
          $v = (python -m PyInstaller --version | Out-String).Trim()
          if ($v -ne "6.22.3") {
            Write-Output "::error::PyInstaller 版本不是锁定的 6.22.3（实际 '$v'）"
            exit 1
          }

      - name: 生成图标
        # 纯标准库生成，不需要 Pillow。产物也一并提交（生成物入库，
        # 这样本地没装 Python 也能直接拿去打包）。
        run: python tools/desktop-shell/make_icon.py tools/desktop-shell/shell.ico

      - name: 打包 exe
        # --distpath / --workpath 显式给死：不显式给的话它们相对于**当前
        # 工作目录**，「在仓库根跑」和「在脚本目录跑」会产出到不同地方，
        # 而下游（冒烟验证、产物上传）都指望产物在固定位置。
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --distpath tools/desktop-shell/dist `
            --workpath tools/desktop-shell/build `
            tools/desktop-shell/launcher.spec

      - name: 冒烟验证（真跑一次 exe）
        # 这步是整个 workflow 的重点。**编译通过不算绿** —— 必须把 exe
        # 跑起来，让它把「打算怎么做」写成 JSON，再逐条断言。
        # 断言逻辑在 tools/desktop-shell/smoke_test.py，本地也能手动跑。
        run: |
          python tools/desktop-shell/smoke_test.py tools/desktop-shell/dist/CWQ.exe

      - name: 验证「真的把浏览器拉起来」（真 spawn）
        # **这一步在验一件 --dry-run 永远验不到的事**：壳真的把浏览器进程
        # 拉起来了，并把参数交出去了。
        #
        # `--dry-run` 在 main() 里是**提前返回**的，压根走不到 spawn()。
        # 所以「CI 的 dry-run 全绿」并不等于「用户双击能开窗」——
        # 中间那一段本来是没有闸的。spawn() 坏掉的症状是「双击什么也不发生」，
        # 没有报错、没有弹窗，比崩溃还难查。
        #
        # 做法：打一个「替身浏览器」真 exe（把自己的命令行参数写成 JSON），
        # 把它放到**真实的 Edge 安装位置**，再**不带参数**运行壳 exe ——
        # 就是用户双击那一下。替身收到参数 = 发现 + spawn 整条路径都通了。
        #
        # **为什么用环境变量沙箱，而不直接往 Program Files 里塞替身**：
        # CI runner 上真的装着 Edge，往那儿塞会破坏 runner 自己的浏览器
        # （还可能触发杀软）。探针把 ProgramFiles(x86) / ProgramFiles /
        # LOCALAPPDATA 三个环境变量指到临时目录 —— 发现逻辑走的是同一段
        # 代码，只是根目录换了，runner 的真 Edge 一根汗毛都不会掉。
        #
        # 断言逻辑在 tools/desktop-shell/launch_path_probe.py。
        run: |
          $stubDir = Join-Path $env:RUNNER_TEMP "cwq-stub"
          New-Item -ItemType Directory -Force -Path $stubDir | Out-Null
          python -m PyInstaller --noconfirm --clean --onefile --name msedge `
            --distpath "$stubDir\dist" --workpath "$stubDir\build" --specpath "$stubDir" `
            tools/desktop-shell/stub_browser.py
          python tools/desktop-shell/launch_path_probe.py `
            --exe tools/desktop-shell/dist/CWQ.exe `
            --stub "$stubDir\dist\msedge.exe"

      - name: 上传 exe 产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cwq-desktop-shell-exe
          path: tools/desktop-shell/dist/CWQ.exe
          retention-days: 30
          # 产物没生成出来就不许「成功」—— 这是把「静默失败」挡在闸外的一道。
          if-no-files-found: error

      # ---------------------------------------------------------------- 安装包
      #
      # **这一步是软失败（continue-on-error）。**
      #
      # Inno Setup 在 GitHub runner 上要靠 chocolatey 装，而 chocolatey 的包
      # 版本会漂 —— 那是**环境**的问题，不是代码的问题。让一个外部源的抖动
      # 把整条流水线染红，会让人开始习惯性地忽略红色，那比红着更糟。
      #
      # 真正的主产物（exe）已经在上一步上传了，而且那一步是硬闸。
      # 安装包出不来时，exe 照样能拿去用。
      - name: 装 Inno Setup
        continue-on-error: true
        run: |
          choco install innosetup --no-progress -y --limit-output
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*" -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { $iscc = Get-ChildItem "${env:ProgramFiles}\Inno Setup*" -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $iscc) { Write-Output "ISCC.exe 没找到"; exit 1 }
          $iscc.FullName | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "ISCC: $($iscc.FullName)"

      - name: 编译安装包
        continue-on-error: true
        run: |
          & $env:ISCC "tools/desktop-shell/installer.iss"

      - name: 上传安装包产物
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cwq-desktop-shell-installer
          path: dist-installer/CWQ-Setup.exe
          retention-days: 30
          if-no-files-found: warn
