# acct.xins.live —— 财务记账系统前端与 API 反代（宝塔形态）
#
# ===========================================================================
# 这份文件**替换**宝塔为 acct.xins.live 自动生成的那份默认 vhost：
#   /www/server/panel/vhost/nginx/acct.xins.live.conf
#
# 不是新增。宝塔已经建了同名 server_name 的 server 块，再加一份就是两个
# server_name 相同的 server —— nginx 会报 conflicting server name 而起不来，
# 或者只认先加载的那份，而我们真正想跑的是后一份。所以是**原地覆盖**，
# 覆盖前务必备份原文件。
#
# ===========================================================================
# 与 deploy/nginx/cwq.conf 的差别
# ===========================================================================
# cwq.conf 是「独立 nginx 里只有本站」的形态；这份是宝塔形态（宝塔上还有
# 另外十几个站点，绝不能替换宝塔的 nginx 本体）。安全响应头、CSP、/api/
# 反代、双写超时等逐字沿用，改动只有下面这些。
#
# 【1】去掉 `server_name _` + 444 白名单
#   cwq.conf 那套是为「独立 nginx 只有一个 catch-all server」设计的：把不认识的
#   Host 直接 444 掉，逼请求只能走到本站。宝塔是每个域名一个独立 vhost，
#   server_name 精确匹配，本来就不会落到别的站点去，多此一举。
#
# 【2】限流：**http 级与 location 级两段都在**，默认不启用
#   限流的骨架是两段文件，指令上下文不同，不能只写一半：
#     /etc/nginx/cwq-include/cwq-rl-zone.conf   （http 级：定义 zone）
#         limit_req_zone  $binary_remote_addr zone=cwq_api:10m rate=<阈值>;
#         limit_conn_zone $binary_remote_addr zone=cwq_api_conn:10m;
#     /etc/nginx/cwq-include/cwq-rl-api.conf    （location 级：引用 zone）
#         limit_req  zone=cwq_api burst=<突发量> nodelay;
#         limit_conn cwq_api_conn <并发连接数>;
#   本文件顶部（server 块之外）include 前者，下面两个 location 里 include
#   后者 —— **两段都要在**，只写 location 级那段而没有 zone 定义，
#   nginx -t 会直接报 unknown limit_req_zone "cwq_api"，配置根本加载不上去。
#   （这一条以前只实现了 location 级，是「限流开关只做了一半」。）
#
#   **怎么开**：照 deploy/nginx/cwq.conf 文件头的「限流开关」那一节建这两个
#   文件（阈值只能用业务峰值定，这里刻意不给默认值），然后
#   nginx -t && nginx -s reload。**删掉这两个文件即关闭。**
#
#   **没建那个目录 nginx 不会起不来**：下面两个 include 都是**通配**，
#   通配 include 在没有匹配文件时不报错（固定文件名的 include 才会）。
#   「文件不存在」就是干净的关闭状态。
#
#   **注意**：宝塔形态下这个 http 级 include 只能出现在**这一份** vhost 里。
#   独立 nginx 形态（cwq.conf）里已经有一份同名 include，两份同时被加载
#   会报 limit_req_zone "cwq_api" is already bound to key ...（直接 emerg）。
#   两种形态是二选一的，不要同时装。
#
# 【3】证书换成宝塔目录，并**保留 .well-known 放行**
#   宝塔用 ACME 给这个域名续签，验证文件写在站点根
#   /www/wwwroot/acct.xins.live/.well-known/ 下。站点根一旦换成
#   /opt/cwq/frontend/dist（deploy.sh 的行为），续签就会 404 —— 而那天证书到期，
#   全站 HTTPS 直接挂掉，且距上一次部署可能已过了好几个月，没人会在那个时点
#   联想到「几个月前换过 root」。这是**不可选项**，不是优化项。
#
# ===========================================================================
# 相对宝塔默认模板，刻意丢掉的四样东西
# ===========================================================================
# 下面四项在宝塔的默认 vhost 里，本文件全部不要。理由逐条写明，不是漏抄：
#
#   a) `include enable-php-83.conf`
#      本站是「静态 dist + FastAPI」，一个 PHP 文件都不需要。留着它等于给站点
#      挂一个能执行任意 .php 的入口 —— 纯增攻击面。
#
#   b) `include /www/server/panel/vhost/nginx/extension/acct.xins.live/*.conf`
#      里面是 site_total.conf，即宝塔面板的**流量统计**：它给每个请求再写一份
#      到 syslog。功能上可有可无，代价是每个请求双份日志。要恢复面板统计，
#      在本文件里把这一行 include 加回来即可（并相应删掉下面的 access_log，
#      否则两份都写）。
#
#   c) `include /www/server/panel/vhost/nginx/well-known/acct.xins.live.conf`
#      宝塔建站时留的空文件（0 字节），没有实际内容。.well-known 的放行改由下面
#      显式的 location ^~ 完成，效果等价且不依赖外部文件。
#
#   d) `include /www/server/panel/vhost/rewrite/acct.xins.live.conf`
#      同样是 0 字节空文件（面板「伪静态」没配过）。
#
# 保留的：`error_page 497`（明文 HTTP 打到 443 端口时的跳转）已在下面的
# server 块里以等价方式处理 —— 80 端口那个 server 负责 301，443 端口只收 TLS。
# 2026-10-26 起 HTTP/3 已重新启用（listen 443 quic / http3 on + Alt-Svc）。
# 当年丢掉它是因为**前提没验**（不确定这个 nginx 编没编 http_v3 模块），
# 现在验过了：nginx 1.26.3 带 --with-http_v3_module，且 OpenSSL 3.5.7 起有
# 原生 QUIC API —— 实测 curl --http3-only 拿到 HTTP/3 200。
# **前提是 UDP 443 在云厂商安全组里放行**，否则从外面连不上 h3（静默降级到
# HTTP/2，不报错）。走 ESA 的客户端本来就与 ESA 之间是 HTTP/3，源站开 h3
# 服务的是**绕过 CDN 直连源站**的那部分流量（DNS 按线路解析，有一条线不走 ESA）。
#
# ===========================================================================
# 启用前必须先做的三件事
# ===========================================================================
#   1. 后端必须在 127.0.0.1:8000 起来（systemd 的 cwq-api.service）。否则
#      /api/ 全部 502，首页却能正常打开 —— 那种「首页正常、一点就报错」的
#      现象排查起来很费时间，所以先 systemctl start 再 reload nginx。
#   2. 先 `nginx -t`，通过了再 `nginx -s reload`。不要直接重启：
#      宝塔上还跑着另外十几个站点，配置写错时 reload 会失败但**旧进程继续服务**
#      （这是好事），而 restart 失败会让那十几个站点一起挂。
#   3. **确认 nginx 版本 >= 1.25.1**（`nginx -v`）。下面 443 那个 server 块里
#      写的是 ``http2 on;`` —— 这个指令是 1.25.1 才引入的独立写法，
#      1.25.1 之前只有 ``listen 443 ssl http2``（而那种写法从 1.25.1 起弃用、
#      1.27 起移除）。宝塔自带的 nginx 与发行版官方源版本往往不同步、偏旧，
#      版本不够时 nginx -t 会报 unknown directive "http2" → **整个配置加载
#      失败**。而在这个形态下那比独立 nginx 形态更隐蔽：reload 失败 →
#      旧进程继续服务 → 这份文件里的 CSP / 安全响应头 / /docs 重定向 /
#      client_max_body_size 全部**静默不生效**，而日志上一切正常。
#      **版本不够时怎么办（别照抄错的方向）：**
#      - nginx 1.9.5 ~ 1.25.0：只能换成 ``listen 443 ssl http2;``（老写法
#        在这些版本上仍受支持）；
#      - nginx >= 1.27：**没有替代写法** —— 老写法已被移除，换过去只会
#        换来 ``invalid parameter "http2"``。这时唯一的选择是升级 nginx。
#      生产机当前跑的是 **1.31.3**（mainline），本文件这份写法在那里
#      加载正常，不需要改。
# ===========================================================================

# ---------------------------------------------------------------------------
# 限流开关的 **http 级**一半（zone 的定义）。
#
# limit_req_zone 的合法上下文只有 http —— 所以它必须写在 server 块之外。
# 本文件被宝塔 include 进 http {}，因此这里可以直接写。
#
# **这一段以前是缺的**：只有下面 location 里的 ``include .../cwq-rl-api*.conf``
# （引用 zone），没有 zone 的定义。按文档启用限流时 nginx -t 直接失败
# （unknown limit_req_zone "cwq_api"），也就是**限流在这个部署形态下
# 永远开不了**。
#
# 通配 include 在没有匹配文件时不报错 → 默认关闭就是干净的关闭状态。
include /etc/nginx/cwq-include/cwq-rl-zone*.conf;

# ---------------------------------------------------------------------------
# ESA 回源双向校验（mTLS）—— **观测用**日志格式
# ---------------------------------------------------------------------------
# 在 combined 的基础上**追加**三个字段，不是替换 —— 既有按前缀/按列解析
# 日志的地方不受影响，只是行尾多了三列。
#
#   mtls=    $ssl_client_verify 的取值
#              NONE    —— 客户端没带证书（现在 EdgeOne 回源、直连测试都是
#                        这一种）
#              SUCCESS —— 带了证书且验签通过（ESA 回源时的预期值）
#              FAILED:xxx —— 带了证书但验签失败（这种请求会被 nginx 挡成
#                        400 "The SSL certificate error"）
#   dn=      $ssl_client_s_dn —— 客户端证书的 Subject，用来确认拿到的
#              确实是 ESA 那张证书
#   cipher=  回源握手实际用的加密套件
# ---------------------------------------------------------------------------
log_format cwq_mtls '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for" '
                     'mtls=$ssl_client_verify dn="$ssl_client_s_dn" '
                     'cipher=$ssl_cipher';


# ---------------------------------------------------------------- Cloudflare
# **CDN 在本机 nginx 前面时**，还原真实客户端 IP。
#
# 不装的话，nginx 看到的对端是 **CDN 的边缘节点 IP** —— 本系统那层按 IP
# 分桶的登录节流于是按「边缘节点」分桶（一个节点后面成千上万个用户共用
# 一个桶），审计日志里的 IP 也全是 Cloudflare 的地址。**且不报错**。
#
# 通配 include：文件不存在时不报错 —— 也就是「没上 CDN」的干净状态。
# 装法见 deploy/nginx/cwq-cloudflare-realip.conf 的文件头。
include /etc/nginx/cwq-include/cwq-cloudflare-realip*.conf;

# ---------------------------------------------------------------- ESA 真实 IP
# **ESA 在本机 nginx 前面时**，还原真实客户端 IP。
#
# 与上面 Cloudflare 那份的差别（别混用）：
#   * 信任的网段是 **ESA 的回源节点网段**（不是 Cloudflare 的）；
#   * 取真实 IP 的头是 **X-Forwarded-For**（不是 CF-Connecting-IP）——
#     ESA 是追加语义，把真实客户端 IP 追加在 XFF **最右边**，客户端自己
#     伪造的前缀会被自动忽略（实测过），所以 nginx 取最后一个元素即可。
#
# 装法见 deploy/esa-realip-update.sh：它拿 ESA 控制台「安全防护 → 源站防护」
# 复制出来的 IP 列表生成这个文件并安全安装（带 nginx -t 与失败回滚）。
#
# **ESA 的回源网段会变**，变了要重跑那个脚本。
#
# 通配 include：文件不存在时不报错 —— 也就是「没装 CDN」的干净状态。
include /etc/nginx/cwq-include/cwq-esa-realip*.conf;


upstream cwq_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ------------------------------------------------------------------
# brotli 预压缩资源（2026-10-26 加）
#
# 生产机的 nginx **没有编译 brotli 模块**（`nginx -V` 里只有
# `--with-http_v3_module`）。要「现压」就得重编 nginx —— 那是一次动整个
# 站点的生产变更，不值得只为省 15% 带宽去做。改成**构建期压好**
# （frontend/scripts/precompress.mjs），产物是一棵**平行树**
# `dist/br/<原路径>`，nginx 这里只负责把压好的那份发出去。
#
# 平行树而不是 `xxx.js.br` 那种同目录后缀：nginx 靠扩展名决定
# Content-Type，同目录后缀会让 mime.types 认不出 `.br`，模块脚本会被
# 浏览器拒收（页面白屏）。平行树里文件名原样保留，Content-Type 照旧。
map $http_accept_encoding $cwq_br_prefix {
    # 客户端**不支持** br —— 指向一个**不存在的目录**。
    # 为什么不直接指向原文件：原文件在这个 location 里是存在的，一旦命中，
    # 发出去的就是没压缩的那份，而这里的 gzip 是关的（见 /assets/ 里的说明）
    # —— 不支持 br 的客户端会拿到一份完全没压缩的资源，比现在还大。
    # 指向不存在的目录 ⇒ 必然 404 ⇒ 落到 @cwq_assets_plain，那边才有 gzip。
    default '/__no_br__';
    # 「明确说不要 br」（br;q=0）：先认掉，别把它当成支持。
    '~*(^|,|\s)br\s*;\s*q=0(\s|,|$)' '/__no_br__';
    # 「支持 br」：token 形式（br / br;q=0.8 / gzip, deflate, br）。
    '~*(^|,|\s)br(\s*;\s*q=[0-9.]+)?(\s|,|$)' '/br';
}

# **Content-Encoding 的判据是「这次实际发的是哪一份」，不是「客户端要什么」。**
#
# 客户端说支持 br，但某个资源**没有** br 版本（压了反而大的小文件、
# 构建时漏掉的）—— 那时发出去的是原文件，**绝不能**再带 Content-Encoding: br，
# 否则浏览器会把没压过的字节当 brotli 解，解出来是乱的，页面直接坏掉。
#
# $uri 在 try_files 命中之后会变成**实际那个文件**的路径，于是
# 「在 br 树里」= 「这次发的是压过的那份」—— 这才是可靠的判据。
map $uri $cwq_br_encoding {
    default '';
    '~^/br/' 'br';
}
server {
    listen 80;
    server_name acct.xins.live;

    # ACME 续签验证：必须排在 location / 之前，且 root 指回宝塔的站点根。
    # 放在这个 server（80 端口）里就够 —— ACME 的文件验证走的就是 80 端口。
    location ^~ /.well-known/ {
        root /www/wwwroot/acct.xins.live;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # `http2 on;` 这种写法**要求 nginx >= 1.25.1**（1.25.1 之前只有
    # `listen 443 ssl http2`；而那种写法从 1.25.1 起弃用、**1.27 起移除**）。
    # 宝塔 nginx 偏旧时这一行会让整份配置加载失败 —— 而 reload 失败是
    # **静默的**（旧进程继续服务，这份文件里的所有设置都不生效）。
    # 先 `nginx -v` 确认版本：只有 1.9.5~1.25.0 才谈得上「换成
    # `listen 443 ssl http2;`」；1.27 起老写法已被移除，换过去只会换来
    # invalid parameter "http2" —— 那时只能升级 nginx。
    http2 on;

    # ------------------------------------------------------------------
    # HTTP/3（QUIC）
    # ------------------------------------------------------------------
    # **同一端口号、不同协议**：TCP 上还是 TLS+HTTP/2，UDP 上是 QUIC。
    # 所以要多开一条 listen（quic），不是把原来那条改成 quic。
    #
    # 前提：nginx 要编译了 --with-http_v3_module，且 TLS 库带 QUIC API。
    # 生产机（nginx 1.26.3 + OpenSSL 3.5.7）两条都满足，实测 HTTP/3 200。
    # **但 UDP 443 还要在云厂商安全组里放行** —— 那不是 nginx 管得到的事，
    # 没放行的话 TCP 一切照常，只是 HTTP/3 从外面连不上（静默地降级）。
    listen 443 quic reuseport;
    http3 on;

    server_name acct.xins.live;

    ssl_certificate     /www/server/panel/vhost/cert/acct.xins.live/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/acct.xins.live/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    # ------------------------------------------------------------------
    # ESA 回源双向校验（mTLS）
    # ------------------------------------------------------------------
    # 信任 ESA 的根证书。ESA 控制台里开启「回源双向校验」后，回源握手里
    # ESA 会**带上自己的客户端证书**，源站靠这条指令验它的签发链 ——
    # 证书对不上，请求会被 nginx 挡成 400 "The SSL certificate error"。
    #
    # 证书出处（ESA 官方文档「回源双向校验」一节，站点粒度配置）：
    #   help.aliyun.com/zh/edge-security-acceleration/esa/user-guide/
    #   back-to-source-protocols-and-ports
    #   CN=Alibaba Cloud, OU=Alibaba Cloud SSL Certificate Authority
    #   RSA 2048 / sha256WithRSAEncryption / CA:TRUE
    #   有效期 2025-01-13 ~ 2035-01-11（自签根，用作信任锚）
    #
    # 安装位置（源站已放好）：
    #   /etc/nginx/ssl/esa/esa-client-ca.pem
    #
    # ssl_verify_client 为什么现在是 optional 而不是 on：
    #   on        —— 握手阶段**必须**收到客户端证书，拿不到直接失败。
    #   optional  —— 没带证书的照常放行；但**带了**证书的必须验签通过
    #                （否则请求被挡成 400）。
    #   现在前置是腾讯云 EdgeOne（回源不带客户端证书），test.xins.live
    #   又是直连源站的 —— 改成 on 的那一刻，这两条链路会同时断。
    #   用 optional 反而立刻能回答「ESA 那张证书在源站这边验不验得过」：
    #   看访问日志里的 mtls= 是不是 SUCCESS。
    #   ESA 接管全部流量、日志确认 mtls=SUCCESS 之后，再改成 on，
    #   那时才是「只有 ESA 能回源」。
    #
    # ssl_verify_depth 2：ESA 的客户端证书可能直接由上面那个根签发
    #   （深度 1 就够），也可能带一层中间证书 —— 给 2 留余量，
    #   免得以后 ESA 换证书链还要回来改。
    ssl_client_certificate /etc/nginx/ssl/esa/esa-client-ca.pem;
    ssl_verify_client     optional;
    ssl_verify_depth      2;
    ssl_session_cache   shared:cwq_ssl:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    # 网关闸必须**宽于**它服务的最大那一条应用闸，否则先拒的是网关，
    # 配置里的上限就成了一句没人能兑现的话。
    #
    # 发票批量上传的应用层合计闸是 50MB（INVOICE_MAX_TOTAL_BYTES，300 张
    # 电子发票约 45~90MB），这里留 2MB 余量给 multipart 的 boundary 与
    # 表单字段开销。报表导入那侧的应用上限是 20MB（IMPORT_MAX_BYTES）。
    # nginx 比应用层宽松的那一段会被完整接收并写进临时文件，然后才被应用拒掉。
    client_max_body_size 52m;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml text/xml
               image/svg+xml
               font/ttf font/otf font/woff font/woff2
               application/vnd.ms-fontobject application/font-woff
               application/x-font-ttf;
    gzip_min_length 1024;
    gzip_vary on;

    root /opt/cwq/frontend/dist;
    index index.html;

    set $cwq_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; frame-src 'self' about:;";
    set $cwq_referrer "same-origin";
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy $cwq_csp always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           $cwq_referrer always;
    add_header X-Frame-Options           "SAMEORIGIN" always;

    # 插件开发文档页的「公开说法」是域名/docs，实际路由却是 hash 路由 /#/docs。
    #
    # 不写这一段会怎样：/docs 落到下面的 try_files，nginx 找不到该文件，于是
    # 返回 index.html —— 首页 HTML 是对的，但 SPA 从 hash 里读路径，它看到的是
    # /docs，匹配不到任何路由，守卫随即把人送去登录页。症状是「文档链接打不开，
    # 跳到登录」，而服务器日志里 200 一切正常，最容易误判成「文档没部署」。
    #
    # 用 `=` 精确匹配：/docs/、/docs/xxx 都不受影响，仍然交给 try_files。
    # URL 要加引号 —— `#` 在 nginx 配置里是注释起始符，不加引号存在被解析成
    # 注释的风险。
    location = /docs {
        return 302 "/#/docs";
    }

    # SPA 兜底：深链接直接刷新也要落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
        # **入口 HTML 不许被缓存。**
        # 不写这一行，浏览器按**启发式规则**缓存它（Chrome/Edge 拿「距
        # Last-Modified 的 10%」当新鲜期）。于是发布之后的**一两个小时**内，
        # 客户端拿到的还是**上一个版本**的 index.html —— 它指向旧的内容
        # 哈希资源，界面看着「没变」。桌面壳那个独立窗口最容易撞上：
        # 它开着的是自己的浏览器 profile，缓存一直留在那儿。
        # no-cache 的意思是「用之前必须重新验证」（304 也算数），成本只有
        # 一次条件请求；带内容哈希的 /assets/ 仍然 immutable 一年。
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy $cwq_csp always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           $cwq_referrer always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
    }

    # 带内容哈希的静态资源，可以长期缓存
    location /assets/ {
        # ------------------------------------------------------------------
        # brotli 分支（2026-10-26 加）：客户端支持 br 时，发构建期压好的那一份。
        #
        # **gzip 这里必须关**：gzip 过滤器会把「已经是 brotli 的字节」再压一遍，
        # 于是响应里出现**两个** Content-Encoding（br + gzip）—— 浏览器按 gzip
        # 解完再按 br 解，拿到的是乱码，页面直接坏掉。（本地 nginx 1.31.8
        # 上实测过这个现象，所以这一行是踩过坑才写下来的。）
        gzip off;
        # Vary 统一由下面那条 add_header 给：gzip_vary 只在「真的 gzip 了」
        # 时才加这个头，而 br 分支不是 gzip —— 不统一就会出现两条 Vary。
        gzip_vary off;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Vary "Accept-Encoding" always;
        # Content-Encoding 由「实际发出的是哪一份」决定，判据见 http 级那个
        # map $uri $cwq_br_encoding 的说明。**不能写成固定的 br** ——
        # 客户端支持 br 但资源没有 br 版本时，那样会把没压过的字节当成
        # brotli 发出去。
        add_header Content-Encoding $cwq_br_encoding always;


        # **只有一条 Cache-Control**（不是两条）。
        #
        # `expires 1y;` 自己就会发一条 `Cache-Control: max-age=31536000`
        # （外加一个 Expires），再叠一条 add_header 就是**两个 Cache-Control
        # 头**。浏览器会把它们合并（`max-age=31536000, public, immutable`），
        # 但 **CDN 不一定**：它按自己那套规则挑「控制缓存行为的那一条」，
        # 两个头就可能挑错、或者只认其中一条 —— 而缓存行为恰恰是 CDN 的
        # 全部意义所在。
        #
        # 所以这里只留一条、一次说清。少了 Expires 头无影响：Cache-Control
        # 的 max-age 是 HTTP/1.1 起的标准写法，要 HTTP/1.0 老客户端才需要
        # 那个头（2026 年不存在）。
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        # **动静分离：静态资源要能被 CDN 跨域取走。**
        #
        # 跨域加载 **ES module 一定要过 CORS 校验**（模块脚本一律走 CORS，
        # 没有「不校验」的选项）—— CDN 上的这份资源必须带
        # Access-Control-Allow-Origin，否则浏览器拒绝执行，页面白屏。
        #
        # 源站就加一遍：CDN 回源时会连响应头一起缓存，这个头于是跟着
        # 缓存对象到了用户端。只在 CDN 控制台里加的话，不同厂商对
        # 「回源加的头」与「源站的头」是否合并的处理不一样，容易出现
        # 「测试域名好的、正式域名 404」这种只在生产现形的差异。
        #
        # 只加在 /assets/ 上：这些是公开构建产物，不含业务数据。
        # **/api/ 的响应绝不能加这个头**。
        add_header Access-Control-Allow-Origin "*" always;
    

        # 候选 1 是 br 树。客户端**不支持** br 时，$cwq_br_prefix 指向一个
        # 不存在的目录（见 http 级那个 map），于是必然 404，落到
        # @cwq_assets_plain —— 那边才有现场 gzip。
        # 支持 br 但这个资源没有 br 版本时，同样落到那边。
        try_files $cwq_br_prefix$uri =404;
        error_page 404 = @cwq_assets_plain;
}
    # 普通资源：客户端不支持 br，或者这个资源没有 br 版本。
    #
    # **为什么单独一个 location**：gzip 只能在整条 location 上开或关，
    # 而 br 分支必须**关掉** gzip（否则双重压缩出两个 Content-Encoding）。
    # 两个分支共用一条 location 就只能一起关 —— 于是普通分支挪到这里，
    # 自己开 gzip。/assets/ 那条只可能发出 br 文件。
    location @cwq_assets_plain {
        gzip on;
        # Vary 统一由下面这条给。gzip_vary 只在「真的 gzip 了」时才加，
        # 不统一就会出现两条 Vary。
        gzip_vary off;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Vary "Accept-Encoding" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # br 树不许被直接访问。
    #
    # 它是给 nginx 自己取的（try_files 内部命中文件，**不经过 location 匹配**），
    # 对外的 URL 不该让人拿到裸的 brotli 字节 —— 浏览器会当普通文件解，乱码。
    location ^~ /br/ {
        return 404;
    }


    # 运行时配置（动静分离的接缝）：决定「API 在哪」「静态资源在哪」，
    # **每套部署都不同**，所以必须 no-cache —— 改了就生效。
    # 精确匹配：只有这一个路径。
    location = /runtime-config.js {
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 可下载产物（桌面壳 exe 等）的下载目录。
    #
    # **为什么单独一个 location，而不是把文件丢进 frontend/dist。**
    # dist 是发布产物：deploy.sh 每次发布都整目录换掉，丢进去的文件下一次
    # 发布就没了 —— 而且发布是自动的，「下载链接突然 404」很容易被误判成
    # 被攻击。下载目录独立于发布流程，发布不会碰它。
    #
    # **alias 的路径按主机渲染**（与上面 root 同一个规矩）：本模板是
    # /opt/cwq 维护机布局，生产（8.155.171.57）是
    # /www/wwwroot/acct.xins.live/downloads/。同步到生产时记得改这一行。
    #
    # **为什么必须写成 location，而不是靠下面 location / 的 try_files 兜。**
    # SPA 兜底是 ``try_files $uri $uri/ /index.html``：找不到的文件会返回
    # index.html，浏览器拿到的是**一个 HTML 页面而不是 exe** —— 症状是
    # 「点下载得到一个网页」，极容易被误判成「服务器返回了错误页」。
    # 前缀 location 比 ``location /`` 更长更优先，会先被选中。
    #
    # **default_type 是必须的**：nginx 自带的 mime.types 里没有 .exe，
    # 不显式给就会落到默认的 text/plain，浏览器会把二进制当文本处理。
    # autoindex 生成的目录页自己声明 text/html，不受这行影响。
    #
    # 安全头写全（add_header 是逐层替换不是合并：只要本层写了任何一条
    # add_header，server 层那几条就**全部不继承**了 —— 与上面 /api/ 段
    # 同一个坑，不写全等于把 CSP 悄悄丢掉）。
    location /downloads/ {
        alias /opt/cwq/downloads/;
        # **autoindex 关掉**：这个目录里放的是「知道链接才能下」的产物
        # （下载路径带一段随机串）。开着索引等于把随机串也公布出去 ——
        # 那随机路径就白设了。关掉之后：目录本身 403，文件按完整路径照常给。
        autoindex off;
        autoindex_exact_size off;   # 目录索引关着时这行无效，留着是防有人再打开
        autoindex_localtime on;
        charset utf-8;
        default_type application/octet-stream;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy $cwq_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy $cwq_referrer always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Query key is required by external cron providers; never write this URL to logs.
    location ~ ^/api/scheduler/tick/?$ {
        access_log off;
        include /etc/nginx/cwq-include/cwq-rl-api*.conf;
        proxy_pass         http://cwq_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        # **API 响应一律不可缓存。**
        # 前面接了 CDN（ESA）之后，这条不是「讲究」而是**防串数据**：
        # /api/* 的响应是**按登录用户区分**的，一旦被边缘缓存住，
        # 用户 A 的凭证会被原样发给用户 B —— 页面照常显示，只是数据串了，
        # **而且不报错**。源站不写这行，就只能靠 CDN 侧规则兜着；
        # CDN 规则漏一条（或将来换一家 CDN）就出事，所以源站自己也要写死。
        #
        # proxy_hide_header 不能省：上游要是自己带了 Cache-Control，
        # 加上 add_header 就会**发两个 Cache-Control**，浏览器按第一个解析，
        # 行为不可预期。先藏掉上游的，再补自己这一条。
        proxy_hide_header Cache-Control;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy $cwq_csp always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           $cwq_referrer always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
    }

    location /api/ {
        proxy_pass         http://cwq_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        # **API 响应一律不可缓存。**
        # 前面接了 CDN（ESA）之后，这条不是「讲究」而是**防串数据**：
        # /api/* 的响应是**按登录用户区分**的，一旦被边缘缓存住，
        # 用户 A 的凭证会被原样发给用户 B —— 页面照常显示，只是数据串了，
        # **而且不报错**。源站不写这行，就只能靠 CDN 侧规则兜着；
        # CDN 规则漏一条（或将来换一家 CDN）就出事，所以源站自己也要写死。
        #
        # proxy_hide_header 不能省：上游要是自己带了 Cache-Control，
        # 加上 add_header 就会**发两个 Cache-Control**，浏览器按第一个解析，
        # 行为不可预期。先藏掉上游的，再补自己这一条。
        proxy_hide_header Cache-Control;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy $cwq_csp always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           $cwq_referrer always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
    }

    # MCP 只读数据服务（app/mcp/，端点 /api/mcp）。**端点必须在 /api/ 前缀下**
    # —— 否则上面 location / 的前端回退（try_files … /index.html）会把
    # /api/mcp 回退成 HTML，client 拿到一段 HTML 当 JSON-RPC 解析，报出来的
    # 是「协议解析失败」而不是 404，排查方向整个跑偏。
    #
    # 下面这组指令是上面 /api/ 的**逐条复制**，理由与打印页那段一样：
    #   * 安全头写全（add_header 是逐层替换不是合并，靠继承的写法早晚会被人
    #     改掉一条而不知情）；
    #   * proxy_* 逐条复制：正则 location **不继承**同级的普通前缀 location
    #     （nginx 只挑一个最优块执行），少一条就是一次静默的行为漂移。
    # 改 /api/ 的代理段时，这里必须一起改。
    location ~ ^/api/mcp {
        proxy_pass         http://cwq_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # **SSE 回包不能缓冲。** MCP 的 Streamable HTTP 传输在客户端声明
        # Accept: text/event-stream 时会用 SSE 回包，而 nginx 默认先把上游
        # 响应攒在缓冲区里再吐给客户端 —— 事件被攒住，client 那边看着像
        # 「服务端卡住不动」，排查起来会跑偏到「后端是不是卡了」。
        proxy_buffering    off;

        # 与 /api/ 一致。
        proxy_connect_timeout 30s;
        proxy_send_timeout    180s;
        # **只有读超时被拉长**（/api/ 是 180s，这里 360s）：长连接在两次
        # 事件之间可以隔很久，180s 一到 nginx 就把连接掐了，client 看到的是
        # 「传输中断」而不是「超时」，两者排查方向完全不同。
        proxy_read_timeout    360s;

        # **这里不写 location 级限流 include**（与上面两处不同）：
        # MCP 自己另有一层按令牌计数的配额（MCP_MAX_CALLS_PER_HOUR），那是按
        # 「谁」限的、比按 IP 限更准；而且 /etc/nginx/cwq-include/ 这个目录
        # 只在 /opt/cwq 维护布局下存在，生产宝塔站点上并没有 —— 照抄那行
        # include 过去，nginx -t 会直接失败（§11.7.6 同一个坑的另一面）。

        # 安全头写全（逐层替换，不继承）。
        # **API 响应一律不可缓存。**
        # 前面接了 CDN（ESA）之后，这条不是「讲究」而是**防串数据**：
        # /api/* 的响应是**按登录用户区分**的，一旦被边缘缓存住，
        # 用户 A 的凭证会被原样发给用户 B —— 页面照常显示，只是数据串了，
        # **而且不报错**。源站不写这行，就只能靠 CDN 侧规则兜着；
        # CDN 规则漏一条（或将来换一家 CDN）就出事，所以源站自己也要写死。
        #
        # proxy_hide_header 不能省：上游要是自己带了 Cache-Control，
        # 加上 add_header 就会**发两个 Cache-Control**，浏览器按第一个解析，
        # 行为不可预期。先藏掉上游的，再补自己这一条。
        proxy_hide_header Cache-Control;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy $cwq_csp always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           $cwq_referrer always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
    }

    # 凭证打印：走浏览器打印，模板要能读到 iframe 里的内容，所以不放 SAMEORIGIN
    location ~ ^/api/books/[^/]+/print/ {
        proxy_pass         http://cwq_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        # **API 响应一律不可缓存。**
        # 前面接了 CDN（ESA）之后，这条不是「讲究」而是**防串数据**：
        # /api/* 的响应是**按登录用户区分**的，一旦被边缘缓存住，
        # 用户 A 的凭证会被原样发给用户 B —— 页面照常显示，只是数据串了，
        # **而且不报错**。源站不写这行，就只能靠 CDN 侧规则兜着；
        # CDN 规则漏一条（或将来换一家 CDN）就出事，所以源站自己也要写死。
        #
        # proxy_hide_header 不能省：上游要是自己带了 Cache-Control，
        # 加上 add_header 就会**发两个 Cache-Control**，浏览器按第一个解析，
        # 行为不可预期。先藏掉上游的，再补自己这一条。
        proxy_hide_header Cache-Control;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    access_log  /www/wwwlogs/acct.xins.live.log cwq_mtls;
    error_log   /www/wwwlogs/acct.xins.live.error.log;
}
