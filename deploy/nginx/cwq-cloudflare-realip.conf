# /etc/nginx/cwq-include/cwq-cloudflare-realip.conf
#
# **Cloudflare 在前、nginx 在后时，把真实客户端 IP 还原出来。**
#
# ---------------------------------------------------------------------------
# 为什么必须有这一段
# ---------------------------------------------------------------------------
# 本系统有一层**按 IP 分桶**的登录节流（LOGIN_IP_*）。它取客户端 IP 的
# 口径是：TCP 对端不在 TRUSTED_PROXIES 白名单里就只认对端。
#
# 源站直连时，nginx 的对端就是用户的 IP（经 nginx 转发给后端的是
# X-Real-IP）。**但 CDN 在前面时，nginx 看到的对端是 CDN 的边缘节点 IP**
# —— 那台机器后面可能连着成千上万个用户。于是：
#
#   * 登录节流按「CDN 边缘节点」分桶 → 一个节点上的所有人共用一个桶 →
#     一个人在连着试错，**同一节点上的其他人一起被挡**（误伤）；
#   * 审计日志里的 IP 全是 Cloudflare 的地址 → 出事时根本查不到是谁；
#   * 「登录失败统计」这类按 IP 做的运营判断全部失真。
#
# 而且这个故障**不报错**：节流照常工作，只是分桶的维度错了。症状是
# 「有人连续输错密码，全公司的同事都登不进去」，而查日志看到的是同一个
# Cloudflare IP。
#
# ---------------------------------------------------------------------------
# 这一段做什么
# ---------------------------------------------------------------------------
# ``real_ip_header CF-Connecting-IP`` + ``set_real_ip_from <Cloudflare 网段>``：
# nginx 在**对端属于 Cloudflare 网段**时，把 ``$remote_addr`` 换成
# ``CF-Connecting-IP`` 里的真实用户 IP。于是：
#
#   * ``$remote_addr`` 变成真实用户 IP；
#   * 现有的 ``proxy_set_header X-Real-IP $remote_addr`` 就自动带对了；
#   * ``X-Forwarded-For`` 用的 ``$proxy_add_x_forwarded_for`` 也带对了；
#   * 后端的 TRUSTED_PROXIES **仍然只填 127.0.0.1**（nginx 仍是后端的
#     直接对端）——**不要**把 Cloudflare 网段填进后端的 TRUSTED_PROXIES，
#     那里填的是「谁在跟后端说话」，不是「谁在跟 nginx 说话」。
#
# ---------------------------------------------------------------------------
# **set_real_ip_from 只列 Cloudflare 的网段，这一条是安全边界**
# ---------------------------------------------------------------------------
# 如果写成 ``set_real_ip_from 0.0.0.0/0``，那么**任何能连到源站的人**都能
# 自己塞一个 ``CF-Connecting-IP: 1.2.3.4``，把自己的 IP 伪造成任意地址 ——
# 于是 IP 维度的节流与审计全部失效（攻击者每次换一个头就换一个桶）。
#
# 所以这里必须**逐条列出 Cloudflare 官方网段**，且源站的安全组/防火墙
# **只放行这些网段**（见 deploy/cloudflare/README.md）。
#
# ---------------------------------------------------------------------------
# 网段从哪来
# ---------------------------------------------------------------------------
#   https://www.cloudflare.com/ips-v4
#   https://www.cloudflare.com/ips-v6
#
# Cloudflare 会增删网段。**升级后请核对一次**：改了这里要 nginx -t &&
# reload。下面的网段是 2026-10 取的官方列表。
#
# ---------------------------------------------------------------------------
# 装法
# ---------------------------------------------------------------------------
#   cp deploy/nginx/cwq-cloudflare-realip.conf /etc/nginx/cwq-include/
#   nginx -t && nginx -s reload
#
# **不用 CDN 就别装这个文件** —— 两份 nginx 配置里那行 include 是**通配**
# include，文件不存在时不报错（这就是干净的「没开」状态）。

# ---- Cloudflare IPv4 ----
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# ---- Cloudflare IPv6 ----
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# 真实客户端 IP 从这个头里取。**只有当对端在上面列出的网段里时才生效**。
#
# 为什么用 CF-Connecting-IP 而不是 X-Forwarded-For：后者是**追加**的
# （每个代理都往后加一个），里面混着整条链路的地址，取哪个都可能是
# 客户端自己写的那个；CF-Connecting-IP 是 Cloudflare 明确写的**单个**
# 真实客户端 IP，语义没有歧义。
real_ip_header CF-Connecting-IP;
