# /etc/nginx/conf.d/cwq.conf
#
# 安全响应头策略（审计 P2-14）
# ============================================================
# 原配置有两条问题：
#   1. 「为打印页放开 CSP」的 location 写的是 ^/api/books/\d+/printing/，
#      而真实打印前缀是 /api/books/{book_id}/print/（app/api/printing.py 的
#      router prefix）—— 打印路由里压根没有 "printing" 这一段，
#      这条正则**永远匹配不到**，等于这个例外从来没生效过；
#   2. 全局没有任何 CSP 头，XSS 没有任何缓解。
#
# 下面两条原则贯穿整个文件：
#
# A. **add_header 是逐层替换，不是合并。** 只要当前层写了任何一条 add_header，
#    上一层的就全部不再继承（nginx 文档里最容易被忽略的一条）。所以这里
#    每个 location 都把安全头写全，不靠继承 —— 靠继承的写法早晚会被人
#    改掉一条而不知情。
# B. **CSP 是求交集，不是叠加。** 同一个响应上发两份 CSP，浏览器按更严的
#    执行。所以「更严的那份」要留给跟内容一起改的那一层（打印页是应用层
#    的 PRINT_CSP），而不是在 nginx 这边写一份看起来更宽的。
#
# ---------------------------------------------------------------------------
# 本文件被主配置 include 进 **http {}**，所以下面两段（upstream / 限流开关）
# 是 http 级指令，可以直接写在 server 之外。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------- 上游复用
#
# 原来两处 `proxy_pass` 都写的是字面量 ``http://127.0.0.1:8000``。字面量地址
# 在 nginx 里等于「每个请求自己建一条上游连接、响应结束就关掉」——
# ``proxy_http_version 1.1`` 只是**允许**复用连接，不写 upstream/keepalive
# 就一条也不会复用。也就是每个 API 请求都要付一次完整的 TCP 握手
# （TLS 终结在 nginx，所以是明文，但仍然是每个请求一次建连 + 一次拆除）。
#
# 走 named upstream + keepalive 之后，空闲连接留在上游侧被下一个请求接着用。
upstream cwq_api {
    server 127.0.0.1:8000;
    # 每个 worker 进程持有的空闲上游连接数上限。32 对应 uvicorn 的 2 个
    # worker 进程，留了足够的余量；它**不是**并发上限（那是 API 自己的事），
    # 只是「同时允许多少条连着不用的连接躺在那儿」。
    # 代价：每条都是一条真实的 socket + 对端的一个 PG/uvicorn 会话上下文，
    # 调得远大于并发峰值就只是在白占 fd。
    keepalive 32;
}

# ---------------------------------------------------------------- 限流开关
#
# **默认不启用，而且这里刻意不提供任何默认阈值。**
#
# 为什么不给默认值：限流的阈值只能用「业务峰值」定，而这套系统的真实峰值
# 没有任何测量数据（月结日与平日的并发能差一个数量级，凭空写一个数上去，
# 要么形同虚设，要么在月结那天把全公司挡在门外 —— 那是比不限流更糟的事）。
# 审计能给的是**开关和骨架**，拍板阈值需要业务数据。
#
# 怎么打开（两步，两段文件的指令上下文不同，不能混）：
#   1) 建 /etc/nginx/cwq-include/cwq-rl-zone.conf，写 http 级指令：
#        limit_req_zone  $binary_remote_addr zone=cwq_api:10m rate=<阈值>;
#        limit_conn_zone $binary_remote_addr zone=cwq_api_conn:10m;
#   2) 建 /etc/nginx/cwq-include/cwq-rl-api.conf，写 location 级指令：
#        limit_req  zone=cwq_api burst=<突发量> nodelay;
#        limit_conn cwq_api_conn <并发连接数>;
#   然后 nginx -t && systemctl reload nginx。**删掉这两个文件即关闭。**
#
# 下面是两个通配 include：nginx 的通配 include 在**没有匹配文件时不报错**，
# 所以「文件不存在」就是干净的关闭状态，不需要额外开关变量。
# （对照：`include /path/固定文件名;` 在文件缺失时会直接启动失败。）
#
# **目录必须是 /etc/nginx/cwq-include/，不能是 conf.d/。** 主配置的
# ``include /etc/nginx/conf.d/*.conf;`` 会把 conf.d 下的东西**再加载一遍**，
# 于是 limit_req_zone 会被声明两次，nginx 直接 emerg：
# ``limit_req_zone "cwq_api" is already bound to key ...``（实测过）。
# 独立目录只有这里的 include 会碰到它。
include /etc/nginx/cwq-include/cwq-rl-zone*.conf;

# ---------------------------------------------------------------------------
# ESA 在前时的**真实客户端 IP**（凭令牌还原，不需要付费的回源网段）
# ---------------------------------------------------------------------------
#
# 背景：ESA 在本机 nginx 前面时，nginx 看到的 TCP 对端是 **ESA 的边缘节点
# IP**。ESA 回源时会带一个头 `ali-real-client-ip`，里面是**真实客户端 IP**
# （实测 2026-10-26：走 ESA 的请求 ali="223.104.53.88"，而 $remote_addr 是
# 113.96.129.x 这种边缘节点地址）。
#
# 不还原的两个后果（**都不报错**，只是安静地错了）：
#   * 登录节流（LOGIN_IP_*，默认 30 次/15 分钟）按「边缘节点」分桶 ——
#     一个节点后面成千上万个用户共用一个桶，一个人连着试错就把同一节点上
#     的其他人一起挡掉（误伤）；
#   * 审计日志里的 IP 全是节点地址 → 出事查不到人。
#
# ---------------------------------------------------------------------------
# 为什么不能直接信 `ali-real-client-ip`
# ---------------------------------------------------------------------------
# **源站 IP 是公开的**：43.138.178.174 直连就能打进来。实测直连时自己塞
# 一个 `ali-real-client-ip: 6.6.6.6`，源站**照单全收**（日志 ali="6.6.6.6"）。
# 裸信这个头 = 把「登录节流的分桶钥匙」交给任何能连到源站的人：攻击者每个
# 请求换一个头就换一个桶，IP 维度限流等于不存在。
#
# 所以这里要一个**只有 ESA 知道**的凭据：ESA 控制台「回源请求头」里固定加
# 一个头 `X-CWQ-Origin-Token: <随机值>`，本配置按值比对。
#   * 令牌对不上 → 一律按 TCP 对端计（= 接入 ESA 之前的行为，不会更差）；
#   * 令牌对得上 → 才认 ESA 说的那个 IP。
#
# **令牌不在这个文件里**：它是 /etc/nginx/cwq-include/cwq-esa-token.conf
# （root:root 600，**不进版本库**）里的一行 map 条目。这里用**通配** include
# 引它 —— 文件不存在时不报错，于是「还没配令牌」= 干净的关闭状态（不信任），
# 而不是 nginx 起不来。
#
# 装法见 deploy/esa-clientip.md。
# 令牌键很长（48 个十六进制字符），而 nginx 默认的 map_hash_bucket_size 只有
# 64 字节 —— 一个桶装不下「键 + 值指针 + 链表指针」（≈ 键长 + 17 字节），
# 于是 ``nginx: [emerg] could not build map_hash, you should increase
# map_hash_bucket_size: 64``，**整份配置加载失败**。
# 那个失败很隐蔽：reload 失败 → 旧进程继续服务 → 新配置一条都没上去，
# 而访问日志一切正常。
# 这个指令要**在用它的 map 之前**（map 创建时才读这个值）。
map_hash_bucket_size 128;

map $http_x_cwq_origin_token $cwq_esa_token_ok {
    default 0;
    include /etc/nginx/cwq-include/cwq-esa-token*.conf;
}

# ESA 回源时带的真实客户端 IP。只接受「一个 IP」，且取**最右**那个 ——
# 客户端自己塞的前缀在最左边，ESA 的值追加在最右边，前缀自动被忽略。
map $http_ali_real_client_ip $cwq_esa_client_ip {
    default "";
    "~^(?:.*?,\s*)?(\d{1,3}(?:\.\d{1,3}){3})\s*$"                  $1;
    "~^(?:.*?,\s*)?([0-9A-Fa-f]{0,4}(?::[0-9A-Fa-f]{0,4}){2,7})\s*$"  $1;
}

# 最终口径：**令牌对上**才用 ESA 说的 IP，否则用 TCP 对端。
map "$cwq_esa_token_ok:$cwq_esa_client_ip" $cwq_client_ip {
    default       $remote_addr;
    "~^1:(.+)$"   $1;
}

# ---------------------------------------------------------------------------
# ESA 回源双向校验（mTLS）—— **观测用**日志格式
# ---------------------------------------------------------------------------
# 在 combined 的基础上**追加**三个字段，不是替换 —— 既有按前缀/按列解析
# 日志的地方不受影响，只是行尾多了三列。
#
#   mtls=    $ssl_client_verify 的取值
#              NONE    —— 客户端没带证书（现在 EdgeOne 回源、直连测试都是
#                        这一种）
#              SUCCESS —— 带了证书且验签通过（ESA 回源时的预期值）
#              FAILED:xxx —— 带了证书但验签失败（这种请求会被 nginx 挡成
#                        400 "The SSL certificate error"）
#   dn=      $ssl_client_s_dn —— 客户端证书的 Subject，用来确认拿到的
#              确实是 ESA 那张证书
#   cipher=  回源握手实际用的加密套件
# ---------------------------------------------------------------------------
log_format cwq_mtls '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for" '
                     'cip="$cwq_client_ip" ali="$http_ali_real_client_ip" '
                     'mtls=$ssl_client_verify dn="$ssl_client_s_dn" '
                     'cipher=$ssl_cipher';


# ---------------------------------------------------------------- Cloudflare
# **CDN 在本机 nginx 前面时**，还原真实客户端 IP。
#
# 不装的话，nginx 看到的对端是 **CDN 的边缘节点 IP** —— 本系统那层按 IP
# 分桶的登录节流于是按「边缘节点」分桶（一个节点后面成千上万个用户共用
# 一个桶），审计日志里的 IP 也全是 Cloudflare 的地址。**且不报错**。
#
# 通配 include：文件不存在时不报错 —— 也就是「没上 CDN」的干净状态。
# 装法见 deploy/nginx/cwq-cloudflare-realip.conf 的文件头。
include /etc/nginx/cwq-include/cwq-cloudflare-realip*.conf;

# ---------------------------------------------------------------- ESA 真实 IP
# **ESA 在本机 nginx 前面时**，还原真实客户端 IP。
#
# 与上面 Cloudflare 那份的差别（别混用）：
#   * 信任的网段是 **ESA 的回源节点网段**（不是 Cloudflare 的）；
#   * 取真实 IP 的头是 **X-Forwarded-For**（不是 CF-Connecting-IP）——
#     ESA 是追加语义，把真实客户端 IP 追加在 XFF **最右边**，客户端自己
#     伪造的前缀会被自动忽略（实测过），所以 nginx 取最后一个元素即可。
#
# 装法见 deploy/esa-realip-update.sh：它拿 ESA 控制台「安全防护 → 源站防护」
# 复制出来的 IP 列表生成这个文件并安全安装（带 nginx -t 与失败回滚）。
#
# **ESA 的回源网段会变**，变了要重跑那个脚本。
#
# 通配 include：文件不存在时不报错 —— 也就是「没装 CDN」的干净状态。
include /etc/nginx/cwq-include/cwq-esa-realip*.conf;


# 跳转白名单（审计 P2-9）。见 deploy/nginx/cwq-host-map.conf 的说明。
# 通配 include 在没有匹配文件时**不报错**，所以这份配置若整个缺失，
# nginx 会带着「$cwq_https_redirect 未定义」启动失败 —— 这是故意的：
# 静默退化成旧行为（信任 $host）比启动失败危险得多。
include /etc/nginx/cwq-include/cwq-host-map*.conf;

# ------------------------------------------------------------------
# brotli 预压缩资源（2026-10-26 加）
#
# 生产机的 nginx **没有编译 brotli 模块**（`nginx -V` 里只有
# `--with-http_v3_module`）。要「现压」就得重编 nginx —— 那是一次动整个
# 站点的生产变更，不值得只为省 15% 带宽去做。改成**构建期压好**
# （frontend/scripts/precompress.mjs），产物是一棵**平行树**
# `dist/br/<原路径>`，nginx 这里只负责把压好的那份发出去。
#
# 平行树而不是 `xxx.js.br` 那种同目录后缀：nginx 靠扩展名决定
# Content-Type，同目录后缀会让 mime.types 认不出 `.br`，模块脚本会被
# 浏览器拒收（页面白屏）。平行树里文件名原样保留，Content-Type 照旧。
map $http_accept_encoding $cwq_br_prefix {
    # 客户端**不支持** br —— 指向一个**不存在的目录**。
    # 为什么不直接指向原文件：原文件在这个 location 里是存在的，一旦命中，
    # 发出去的就是没压缩的那份，而这里的 gzip 是关的（见 /assets/ 里的说明）
    # —— 不支持 br 的客户端会拿到一份完全没压缩的资源，比现在还大。
    # 指向不存在的目录 ⇒ 必然 404 ⇒ 落到 @cwq_assets_plain，那边才有 gzip。
    default '/__no_br__';
    # 「明确说不要 br」（br;q=0）：先认掉，别把它当成支持。
    '~*(^|,|\s)br\s*;\s*q=0(\s|,|$)' '/__no_br__';
    # 「支持 br」：token 形式（br / br;q=0.8 / gzip, deflate, br）。
    '~*(^|,|\s)br(\s*;\s*q=[0-9.]+)?(\s|,|$)' '/br';
}

# **Content-Encoding 的判据是「这次实际发的是哪一份」，不是「客户端要什么」。**
#
# 客户端说支持 br，但某个资源**没有** br 版本（压了反而大的小文件、
# 构建时漏掉的）—— 那时发出去的是原文件，**绝不能**再带 Content-Encoding: br，
# 否则浏览器会把没压过的字节当 brotli 解，解出来是乱的，页面直接坏掉。
#
# $uri 在 try_files 命中之后会变成**实际那个文件**的路径，于是
# 「在 br 树里」= 「这次发的是压过的那份」—— 这才是可靠的判据。
map $uri $cwq_br_encoding {
    default '';
    '~^/br/' 'br';
}
server {
    listen 80;
    server_name _;

    # **跳转目标不再直接用 $host。**
    #
    # 原来这里写的是 ``return 301 https://$host$request_uri;``。$host 取自
    # 客户端发来的 Host 头，而 server_name 是 ``_``（兜底匹配一切），
    # nginx 不会拿它跟任何东西核对。于是请求带
    # ``Host: evil.example`` 就会拿到
    # ``301 https://evil.example/<原路径>`` —— 一个开放重定向：
    # 钓鱼链接看着像自家域名，实际把人送到别处；
    # 缓存与浏览器历史也会被这记跳转污染。
    #
    # 现在改成查表：$cwq_https_redirect 由 cwq-host-map.conf 的 map 生成，
    # **不在白名单里就是空串**，空串一律 444 直接掐断连接（不跳转、不响应）。
    # 这样未知 Host 既不会被跳走，也不会泄露本服务存在。
    #
    # **443 端口用的是同一张表**（见下面 443 server 里的说明）：两个端口
    # 的 Host 白名单只有一份，不会出现「80 认这个域名、443 不认」的对称性
    # 破口。
    if ($cwq_https_redirect = "") {
        return 444;
    }
    return 301 $cwq_https_redirect;
}

server {
    listen 443 ssl;
    # `listen ... http2` 这种写法从 nginx 1.25.1 起弃用、**1.27 起移除**
    # （移除之后不是告警，是 invalid parameter "http2" 直接加载失败）。
    # 拆成 listen + http2 是官方给的新写法，**要求 nginx >= 1.25.1**。
    # 注意：Debian 12 是 1.22、Ubuntu 24.04 是 1.24，**两个都还不够** ——
    # 2026-10-21 的 CI 就是装上 Ubuntu 24.04 的 nginx 1.24.0 之后，
    # nginx -t 报 unknown directive "http2"，把这份配置误判成坏的。
    # 要么装 nginx.org 的源（生产机跑的是 1.31.3），要么就别开 http2。
    http2 on;

    # ------------------------------------------------------------------
    # HTTP/3（QUIC）
    # ------------------------------------------------------------------
    # **同一端口号、不同协议**：TCP 上还是 TLS+HTTP/2，UDP 上是 QUIC。
    # 所以要多开一条 listen（quic），不是把原来那条改成 quic。
    #
    # 前提：nginx 要编译了 --with-http_v3_module，且 TLS 库带 QUIC API。
    # 生产机（nginx 1.26.3 + OpenSSL 3.5.7）两条都满足，实测 HTTP/3 200。
    # **但 UDP 443 还要在云厂商安全组里放行** —— 那不是 nginx 管得到的事，
    # 没放行的话 TCP 一切照常，只是 HTTP/3 从外面连不上（静默地降级）。
    listen 443 quic reuseport;
    http3 on;

    server_name _;

    # ------------------------------------------------------------------
    # **Host 白名单：443 与 80 现在是同一份**（审查 P0-1 的一半）
    # ------------------------------------------------------------------
    #
    # 原来这里**没有**任何 Host 校验，而 80 端口那个 server 有 ——
    # 于是同一个 nginx 上出现了「80 认域名、443 谁来都接待」的不对称。
    # 那个不对称的后果不只是「多一个人能连上来」：
    #
    # **``$host`` 会一路传到后端**（下面每个 proxy 段都有
    # ``proxy_set_header Host $host;``）。而后端有一处**按请求的
    # base_url 拼验证链接**的地方（管理员二次验证的邮件链接）——
    # 那正是钓鱼链接的经典形态：攻击者带 ``Host: evil.example``
    # 登录一次，系统就会发出一封**域名正规、系统自己发出**、但链接指向
    # 攻击者域名的邮件。管理员点开 → 令牌落到对方手里 → 对方换到管理员
    # 访问令牌。**二次验证反而成了投递通道。**
    #
    # 所以：**未知 Host 一律 444**（连响应都不给，对方无法区分「端口关闭」
    # 「服务不存在」「Host 不对」），与 80 端口的处理**完全一致**。
    #
    # **白名单只有一份**：就是 ``cwq-host-map.conf`` 里那个
    # ``map $host $cwq_https_redirect`` —— 「这个 Host 在白名单里」
    # 等价于「这张表给它查出了非空的值」（表里每一行都对应一个合法域名，
    # default 是空串）。**刻意不再维护第二张表**：两张表迟早会漂移，
    # 而漂移的结果是「80 跳到某处、443 却不认」—— 那正是这次要修的不对称。
    #
    # ⚠️ 这条依赖 ``cwq-host-map.conf`` 被装上：该文件缺失时 nginx 会因为
    # 「$cwq_https_redirect 未定义」**拒绝启动**（见本文件里那行 include
    # 的说明）—— 这是**故意的**：静默退化成「信任 $host」比启动失败危险得多。
    if ($cwq_https_redirect = "") {
        return 444;
    }

    ssl_certificate     /etc/nginx/ssl/cwq.crt;
    ssl_certificate_key /etc/nginx/ssl/cwq.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    # ------------------------------------------------------------------
    # ESA 回源双向校验（mTLS）
    # ------------------------------------------------------------------
    # 信任 ESA 的根证书。ESA 控制台里开启「回源双向校验」后，回源握手里
    # ESA 会**带上自己的客户端证书**，源站靠这条指令验它的签发链 ——
    # 证书对不上，请求会被 nginx 挡成 400 "The SSL certificate error"。
    #
    # 证书出处（ESA 官方文档「回源双向校验」一节，站点粒度配置）：
    #   help.aliyun.com/zh/edge-security-acceleration/esa/user-guide/
    #   back-to-source-protocols-and-ports
    #   CN=Alibaba Cloud, OU=Alibaba Cloud SSL Certificate Authority
    #   RSA 2048 / sha256WithRSAEncryption / CA:TRUE
    #   有效期 2025-01-13 ~ 2035-01-11（自签根，用作信任锚）
    #
    # 安装位置（源站已放好）：
    #   /etc/nginx/ssl/esa/esa-client-ca.pem
    #
    # ssl_verify_client 为什么现在是 optional 而不是 on：
    #   on        —— 握手阶段**必须**收到客户端证书，拿不到直接失败。
    #   optional  —— 没带证书的照常放行；但**带了**证书的必须验签通过
    #                （否则请求被挡成 400）。
    #   现在前置是腾讯云 EdgeOne（回源不带客户端证书），test.xins.live
    #   又是直连源站的 —— 改成 on 的那一刻，这两条链路会同时断。
    #   用 optional 反而立刻能回答「ESA 那张证书在源站这边验不验得过」：
    #   看访问日志里的 mtls= 是不是 SUCCESS。
    #   ESA 接管全部流量、日志确认 mtls=SUCCESS 之后，再改成 on，
    #   那时才是「只有 ESA 能回源」。
    #
    # ssl_verify_depth 2：ESA 的客户端证书可能直接由上面那个根签发
    #   （深度 1 就够），也可能带一层中间证书 —— 给 2 留余量，
    #   免得以后 ESA 换证书链还要回来改。
    ssl_client_certificate /etc/nginx/ssl/esa/esa-client-ca.pem;
    ssl_verify_client     optional;
    ssl_verify_depth      2;
    access_log  /var/log/nginx/access.log cwq_mtls;

    # 不在错误页与响应头里暴露 nginx/内核版本（信息泄露，无业务影响）
    server_tokens off;

    # 财务报表导入可能较大 —— 但**上限由应用层说了算**（config.py 的
    # import_max_bytes，默认 20MB）。原来这里是 50m，于是 20~50MB 的上传
    # 会被 nginx **完整接收**、写进临时文件，然后才被应用层拒掉：
    # 白占磁盘、白花 IO，拒绝还晚了一步。降到比应用上限略高（留 1MB 余量，
    # 够 multipart 的 boundary 与表单字段开销），让拒绝发生在**进 nginx
    # 之前**。
    # 两边必须一起改：调高应用层 import_max_bytes 的同时要调高这里。
    #
    # 现在的 52m 是被**发票批量上传**顶上去的：应用层的合计闸
    # INVOICE_MAX_TOTAL_BYTES 是 50MB（300 张电子发票约 45~90MB，取 50MB），
    # 这里留 2MB 余量给 multipart 的 boundary 与表单字段开销。
    # 报表导入那侧的应用上限仍是 20MB（import_max_bytes），
    # 比这里小 —— 所以 20~52MB 的报表上传仍会先进 nginx 的临时文件再被应用拒。
    # 那是被**现状**承认的代价：网关必须比它服务的最大那一条更宽。
    client_max_body_size 52m;

    gzip on;
    # gzip_proxied **保持默认，不要动它。**
    #
    # 审计里有人据此判过「API 完全不压缩」，那是误判：nginx 官方文档对
    # gzip_proxied 的判定依据写得很清楚 —— *"The fact that the request is
    # proxied is determined by the presence of the 'Via' request header
    # field"*，也就是说它看的是**请求里有没有 Via 头**，不是「上游是不是
    # 一个代理」。浏览器直连 nginx 的请求不带 Via，所以 `gzip on` 本来就
    # 生效。给它加上 `any` 才是把已经开着的东西再写一遍；而一旦有人
    # 反过来把它删成默认的 `off`（默认值是 off），**压缩就真的全关了**。
    # 来源：https://nginx.org/en/docs/http/ngx_http_gzip_module.html
    #
    # 原来只有 4 个类型，漏掉的恰好是收益最大的两批：
    #   * text/plain            —— 导出/下载类接口回的头
    #   * text/javascript       —— 旧 MIME 名，实际很常见
    #   * application/xml / text/xml —— 对账/交换类导出
    #   * 字体                  —— woff2 在这个项目里是实打实的体积
    #     （font-src 'self' data: 说明有字体，且 base64 内联字体最吃压缩）
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml text/xml
               image/svg+xml
               font/ttf font/otf font/woff font/woff2
               application/vnd.ms-fontobject application/font-woff
               application/x-font-ttf;
    gzip_min_length 1024;
    # 默认 off。**现在不暴露**：nginx 直连用户，中间没有共享缓存，
    # 缓存里存的那份压缩/非压缩响应不会串。
    # 将来接 CDN 之后它才是真故障 —— CDN 按 Vary 选缓存变体，
    # 缺 Vary: Accept-Encoding 就可能把「压缩版」发给了不支持压缩的客户端。
    # 现在补上零风险。
    gzip_vary on;

    root /opt/cwq/frontend/dist;
    index index.html;

    # 报表导出用的 Excel 是内联样式表 + 图片，塞进 CSP 的 img-src data:
    # 与前端保持同一份，允许 data: 与 blob:。
    #
    # style-src 必须留 'unsafe-inline'，**这不是偷懒**：
    #   1. Vue 的 :style 绑定编译成行内 style 属性，没有 'unsafe-inline' 就全挂；
    #   2. 更要紧的是打印预览 —— 前端拿 HTML 后写进 iframe 的 srcdoc
    #      （ARCHITECTURE「前端打印的坑」），而 about:srcdoc 文档会**继承**
    #      父页面的 CSP。所以这里写成 style-src 'self' 的话，
    #      打印页那份更严的 PRINT_CSP（style-src 'unsafe-inline'）
    #      与本页取交集，行内样式会被整个拦掉 —— 打印直接空白。
    #      取交集的语义（更严的胜出）在这里正好是要的方向。
    # frame-src 显式带 about: 同理：srcdoc 是 about:srcdoc，
    # 留一条免得将来收紧时把打印预览静默弄没。
    set $cwq_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; frame-src 'self' about:";
    set $cwq_referrer "same-origin";

    # HSTS（审计 P2-8）。原来这一组只有 CSP/nosniff/Referrer/XFO，没有
    # Strict-Transport-Security —— 首次访问的 SSL strip（用户先收到一个明文
    # 页面、再被引导到 https）没有任何东西拦得住。
    #
    # **故意不加 includeSubDomains**：加了等于替所有子域做主，而它们是否都有
    # 有效证书不是这份配置能保证的 —— 有一个子域漏证书，浏览器就会把它整个
    # 钉死在 HTTPS 上，且**用户无法绕过**。max-age 一年是足够让「首次访问的
    # 明文窗口」消失的量级，子域覆盖留给部署时按实际证书情况再加。
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # always：nginx 默认**只在** 2xx/3xx 上加头，4xx/5xx 一律不加 ——
    # 而 XSS 最爱躲在错误页里。安全头不能按状态码挑着发。
    add_header Content-Security-Policy $cwq_csp always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           $cwq_referrer always;
    # 与 frame-ancestors 'self' 同义，给不认 CSP 的老浏览器兜底
    add_header X-Frame-Options           "SAMEORIGIN" always;

    location / {
        # 前端用的是 hash 路由，回退到 index.html 是安全的
        try_files $uri $uri/ /index.html;

        # **入口 HTML 不许被缓存。**
        # 不写这一行，浏览器按**启发式规则**缓存它（Chrome/Edge 拿「距
        # Last-Modified 的 10%」当新鲜期）。于是发布之后的**一两个小时**内，
        # 客户端拿到的还是**上一个版本**的 index.html —— 它指向旧的内容
        # 哈希资源，界面看着「没变」。桌面壳那个独立窗口最容易撞上：
        # 它开着的是自己的浏览器 profile，缓存一直留在那儿。
        # no-cache 的意思是「用之前必须重新验证」（304 也算数），成本只有
        # 一次条件请求；带内容哈希的 /assets/ 仍然 immutable 一年。
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "no-cache" always;

        # 显式重复（见文件头原则 A：继承靠不住）。
        # 这里是唯一由 nginx 自己吐出 HTML 文档的地方，所以 CSP 的落点就在这。
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy $cwq_csp always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           $cwq_referrer always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
    }

    location /assets/ {
        # ------------------------------------------------------------------
        # brotli 分支（2026-10-26 加）：客户端支持 br 时，发构建期压好的那一份。
        #
        # **gzip 这里必须关**：gzip 过滤器会把「已经是 brotli 的字节」再压一遍，
        # 于是响应里出现**两个** Content-Encoding（br + gzip）—— 浏览器按 gzip
        # 解完再按 br 解，拿到的是乱码，页面直接坏掉。（本地 nginx 1.31.8
        # 上实测过这个现象，所以这一行是踩过坑才写下来的。）
        gzip off;
        # Vary 统一由下面那条 add_header 给：gzip_vary 只在「真的 gzip 了」
        # 时才加这个头，而 br 分支不是 gzip —— 不统一就会出现两条 Vary。
        gzip_vary off;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Vary "Accept-Encoding" always;
        # Content-Encoding 由「实际发出的是哪一份」决定，判据见 http 级那个
        # map $uri $cwq_br_encoding 的说明。**不能写成固定的 br** ——
        # 客户端支持 br 但资源没有 br 版本时，那样会把没压过的字节当成
        # brotli 发出去。
        add_header Content-Encoding $cwq_br_encoding always;


        # **只有一条 Cache-Control**（不是两条）。
        #
        # `expires 1y;` 自己就会发一条 `Cache-Control: max-age=31536000`
        # （外加一个 Expires），再叠一条 add_header 就是**两个 Cache-Control
        # 头**。浏览器会把它们合并（`max-age=31536000, public, immutable`），
        # 但 **CDN 不一定**：它按自己那套规则挑「控制缓存行为的那一条」，
        # 两个头就可能挑错、或者只认其中一条 —— 而缓存行为恰恰是 CDN 的
        # 全部意义所在。
        #
        # 所以这里只留一条、一次说清。少了 Expires 头无影响：Cache-Control
        # 的 max-age 是 HTTP/1.1 起的标准写法，要 HTTP/1.0 老客户端才需要
        # 那个头（2026 年不存在）。
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # .js/.css 上 CSP 对浏览器没有意义（策略只作用于文档），
        # 但 nosniff 有意义 —— 它挡的是把 .txt / .svg 当脚本加载的那一类。
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        # **动静分离：静态资源要能被 CDN 跨域取走。**
        #
        # 跨域加载 **ES module 一定要过 CORS 校验**（模块脚本一律走 CORS，
        # 没有「不校验」的选项）—— 所以 CDN 上的这份资源必须带
        # Access-Control-Allow-Origin，否则浏览器直接拒绝执行，
        # 页面停在「白屏 + 控制台一条 CORS 错误」。
        #
        # 为什么这里（源站）就要加：CDN 回源时会把**源站的响应头一起缓存**，
        # 于是这个头跟着缓存对象一起到了用户端。若只在 CDN 控制台里加，
        # 而源站没加 —— 取决于 CDN 是否把「回源时加的头」与「源站的头」
        # 合并，不同厂商行为不同，**很容易出现「测试时好的、正式域名 404」**
        # 这种只在生产才现形的差异。源站加一遍最稳。
        #
        # 安全影响：`*` 只表示「任何源都能取这份静态资源」。这些文件是
        # 公开的构建产物（不含任何业务数据与密钥），所以放开是对的。
        # **注意它只加在 /assets/ 上** —— /api/ 的响应绝不能加（那是业务数据）。
        add_header Access-Control-Allow-Origin "*" always;
    

        # 候选 1 是 br 树。客户端**不支持** br 时，$cwq_br_prefix 指向一个
        # 不存在的目录（见 http 级那个 map），于是必然 404，落到
        # @cwq_assets_plain —— 那边才有现场 gzip。
        # 支持 br 但这个资源没有 br 版本时，同样落到那边。
        try_files $cwq_br_prefix$uri =404;
        error_page 404 = @cwq_assets_plain;
}
    # 普通资源：客户端不支持 br，或者这个资源没有 br 版本。
    #
    # **为什么单独一个 location**：gzip 只能在整条 location 上开或关，
    # 而 br 分支必须**关掉** gzip（否则双重压缩出两个 Content-Encoding）。
    # 两个分支共用一条 location 就只能一起关 —— 于是普通分支挪到这里，
    # 自己开 gzip。/assets/ 那条只可能发出 br 文件。
    location @cwq_assets_plain {
        gzip on;
        # Vary 统一由下面这条给。gzip_vary 只在「真的 gzip 了」时才加，
        # 不统一就会出现两条 Vary。
        gzip_vary off;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Vary "Accept-Encoding" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # br 树不许被直接访问。
    #
    # 它是给 nginx 自己取的（try_files 内部命中文件，**不经过 location 匹配**），
    # 对外的 URL 不该让人拿到裸的 brotli 字节 —— 浏览器会当普通文件解，乱码。
    location ^~ /br/ {
        return 404;
    }


    # ------------------------------------------------------------------------
    # 运行时配置（动静分离的接缝）
    # ------------------------------------------------------------------------
    # 这一个文件决定「API 在哪」「静态资源在哪」，**每套部署都不同**。
    # 所以它必须 **no-cache**：改了就生效，不能被浏览器或中间层缓存住。
    #
    # 为什么单独一个 location 而不是并进 / ：它的缓存策略与入口 HTML
    # 一样（不能缓存），但**用途不同** —— HTML 是「页面」，它是「配置」。
    # 混在一起写会让后来人以为「入口 HTML 那套 no-cache 也管着它」，
    # 而真要改的时候不知道该改哪一段。
    #
    # **精确匹配**（= 而不是前缀）：只有这一个路径。
    location = /runtime-config.js {
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Query key is required by external cron providers; never write this URL to logs.
    location ~ ^/api/scheduler/tick/?$ {
        access_log off;
        include /etc/nginx/cwq-include/cwq-rl-api*.conf;
        proxy_pass         http://cwq_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $cwq_client_ip;
        proxy_set_header   X-Forwarded-For   $cwq_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        # **API 响应一律不可缓存。**
        # 前面接了 CDN（ESA）之后，这条不是「讲究」而是**防串数据**：
        # /api/* 的响应是**按登录用户区分**的，一旦被边缘缓存住，
        # 用户 A 的凭证会被原样发给用户 B —— 页面照常显示，只是数据串了，
        # **而且不报错**。源站不写这行，就只能靠 CDN 侧规则兜着；
        # CDN 规则漏一条（或将来换一家 CDN）就出事，所以源站自己也要写死。
        #
        # proxy_hide_header 不能省：上游要是自己带了 Cache-Control，
        # 加上 add_header 就会**发两个 Cache-Control**，浏览器按第一个解析，
        # 行为不可预期。先藏掉上游的，再补自己这一条。
        proxy_hide_header Cache-Control;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy $cwq_csp always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           $cwq_referrer always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
    }

    location /api/ {
        # 指向 named upstream，不是字面量 IP —— 复用见文件头 upstream 段的说明
        proxy_pass         http://cwq_api;
        proxy_http_version 1.1;
        # **keepalive 生效的必要条件。** 默认的 proxy_set_header 会带上
        # `Connection: close`（1.0 时代为兼容留下的默认值），而 nginx 只有在
        # 这一行为空时才把上游连接放回复用池。少了这一行，上面写的 keepalive 32
        # 是一次都不会被用上的 —— 它不报错、不告警，只是安静地不生效。
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $cwq_client_ip;
        proxy_set_header   X-Forwarded-For   $cwq_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 打印 / 报表导出可能算得久
        proxy_connect_timeout 30s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        # 限流的 location 级开关（默认不启用）。
        # 打开前请先按文件头的说明建好 http 级的 zone 文件，**并结合业务峰值
        # 确定阈值** —— 这里不给默认 rate/burst/limit_conn。
        include /etc/nginx/cwq-include/cwq-rl-api*.conf;

        # JSON 响应的 CSP 是惰性的，但保持全局一致：将来任何一个
        # /api/ 下的接口开始回 HTML 时，不会因为「这里没写 CSP」而漏掉。
        # **API 响应一律不可缓存。**
        # 前面接了 CDN（ESA）之后，这条不是「讲究」而是**防串数据**：
        # /api/* 的响应是**按登录用户区分**的，一旦被边缘缓存住，
        # 用户 A 的凭证会被原样发给用户 B —— 页面照常显示，只是数据串了，
        # **而且不报错**。源站不写这行，就只能靠 CDN 侧规则兜着；
        # CDN 规则漏一条（或将来换一家 CDN）就出事，所以源站自己也要写死。
        #
        # proxy_hide_header 不能省：上游要是自己带了 Cache-Control，
        # 加上 add_header 就会**发两个 Cache-Control**，浏览器按第一个解析，
        # 行为不可预期。先藏掉上游的，再补自己这一条。
        proxy_hide_header Cache-Control;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy $cwq_csp always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           $cwq_referrer always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
    }

    # MCP 只读数据服务（app/mcp/，端点 /api/mcp）。**端点必须在 /api/ 前缀下**
    # —— 否则上面 location / 的前端回退（try_files … /index.html）会把
    # /api/mcp 回退成 HTML，client 拿到一段 HTML 当 JSON-RPC 解析，
    # 报出来的是「协议解析失败」而不是 404，排查方向整个跑偏。
    #
    # 下面这组指令是上面 /api/ 的**逐条复制**，理由与打印页那段一样：
    #   * 安全头写全（原则 A）：add_header 是逐层替换不是合并，靠继承的写法
    #     早晚会被人改掉一条而不知情；
    #   * proxy_* 逐条复制：正则 location **不继承**同级的普通前缀 location
    #     （nginx 只挑一个最优块执行），少一条就是一次静默的行为漂移。
    # 改 /api/ 的代理段时，这里必须一起改。
    location ~ ^/api/mcp {
        # 与 /api/ 保持一致：同一个 named upstream、同样的 keepalive 前提
        proxy_pass         http://cwq_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $cwq_client_ip;
        proxy_set_header   X-Forwarded-For   $cwq_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # **SSE 回包不能缓冲。** MCP 的 Streamable HTTP 传输在客户端声明
        # Accept: text/event-stream 时会用 SSE 回包，而 nginx 默认先把上游
        # 响应攒在缓冲区里再吐给客户端 —— 事件被攒住，client 那边看着像
        # 「服务端卡住不动」，排查起来会跑偏到「后端是不是卡了」。
        proxy_buffering    off;

        # 与 /api/ 一致。
        proxy_connect_timeout 30s;
        # 请求体方向与 /api/ 一致（180s）：MCP 的请求体是 JSON-RPC 报文，
        # 很小，发不出去只可能是网络本身有问题，不必放宽。
        proxy_send_timeout    180s;
        # **只有读超时被拉长**（/api/ 是 180s，这里 360s）：长连接在两次
        # 事件之间可以隔很久，180s 一到 nginx 就把连接掐了，client 看到的是
        # 「传输中断」而不是「超时」，两者排查方向完全不同。
        proxy_read_timeout    360s;

        # 与 /api/ 一致：限流的 location 级开关，默认不启用。
        # MCP 自己另有一层按令牌计数的配额（MCP_MAX_CALLS_PER_HOUR），那是按
        # 「谁」限的、比这里按 IP 限更准；这一层是网络侧的兜底。
        include /etc/nginx/cwq-include/cwq-rl-api*.conf;

        # 安全头写全（原则 A：逐层替换，不继承）。
        # **API 响应一律不可缓存。**
        # 前面接了 CDN（ESA）之后，这条不是「讲究」而是**防串数据**：
        # /api/* 的响应是**按登录用户区分**的，一旦被边缘缓存住，
        # 用户 A 的凭证会被原样发给用户 B —— 页面照常显示，只是数据串了，
        # **而且不报错**。源站不写这行，就只能靠 CDN 侧规则兜着；
        # CDN 规则漏一条（或将来换一家 CDN）就出事，所以源站自己也要写死。
        #
        # proxy_hide_header 不能省：上游要是自己带了 Cache-Control，
        # 加上 add_header 就会**发两个 Cache-Control**，浏览器按第一个解析，
        # 行为不可预期。先藏掉上游的，再补自己这一条。
        proxy_hide_header Cache-Control;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy $cwq_csp always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           $cwq_referrer always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
    }

    # 打印页：真实前缀是 /api/books/{book_id}/print/（不是 /printing/）。
    # 用 [^/]+ 而不是 \d+：书套 id 的形态是应用层决定的，哪天从整型换成别的
    # 写法，这条规则不该悄悄失效（而失效是**无声**的 —— 只会看到 CSP 突然拦住了东西）。
    #
    # 正则 location 的优先级高于普通前缀 location（没有 ^~ 时），
    # 所以这一段会先于上面的 /api/ 命中打印请求。
    #
    # 这里**故意不加** $cwq_csp：打印页是 HTML 文档，它自带应用层的
    # PRINT_CSP（app/api/printing.py::_html_response 的响应头 +
    # app/printing/template.py 内联的 <meta http-equiv>），
    # 那份比这里的严格得多（script-src 'none'、img-src 'none'、form-action 'none'）。
    # 两份都发的话按更严的执行，而「更严的那份」必须跟着渲染逻辑一起改 ——
    # 那是应用层的事，nginx 这份写宽写严都会带来一次「改了 CSP 结果打印空白」的追查。
    # 下面这组 proxy 指令是上面 /api/ 的**逐条复制**。这不是手抖，是正则
    # location 不继承同级的普通前缀 location：nginx 的 location 匹配只挑**一个**
    # 最优的块去执行，不存在「先匹配 /api/ 再叠加这里」这回事。
    # 所以每次改 /api/ 的代理段，这里必须一起改 —— 改一处漏一处的后果是
    # 打印接口静默退回旧行为（连接不复用），而它照常工作、没有任何报错。
    location ~ ^/api/books/[^/]+/print/ {
        # 与 /api/ 保持一致：同一个 named upstream、同样的 keepalive 前提
        proxy_pass         http://cwq_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $cwq_client_ip;
        proxy_set_header   X-Forwarded-For   $cwq_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        # 与 /api/ 一致：限流的 location 级开关，默认不启用
        include /etc/nginx/cwq-include/cwq-rl-api*.conf;

        # 只保留 nosniff：内容类型由应用决定，X-Content-Type-Options
        # 仍然有用（防止 .html 预览被嗅探成别的类型）。
        # **API 响应一律不可缓存。**
        # 前面接了 CDN（ESA）之后，这条不是「讲究」而是**防串数据**：
        # /api/* 的响应是**按登录用户区分**的，一旦被边缘缓存住，
        # 用户 A 的凭证会被原样发给用户 B —— 页面照常显示，只是数据串了，
        # **而且不报错**。源站不写这行，就只能靠 CDN 侧规则兜着；
        # CDN 规则漏一条（或将来换一家 CDN）就出事，所以源站自己也要写死。
        #
        # proxy_hide_header 不能省：上游要是自己带了 Cache-Control，
        # 加上 add_header 就会**发两个 Cache-Control**，浏览器按第一个解析，
        # 行为不可预期。先藏掉上游的，再补自己这一条。
        proxy_hide_header Cache-Control;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
