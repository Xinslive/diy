# /etc/nginx/conf.d/cwq.conf
server {
    listen 80;
    server_name _;
    # 生产请启用 HTTPS 并跳转
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cwq.crt;
    ssl_certificate_key /etc/nginx/ssl/cwq.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 财务报表导入可能较大
    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /opt/cwq/frontend/dist;
    index index.html;

    location / {
        # 前端用的是 hash 路由，回退到 index.html 是安全的
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 打印 / 报表导出可能算得久
        proxy_connect_timeout 30s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # 打印预览页要单独放开 CSP，否则 iframe 里的样式被拦
    location ~* ^/api/books/\d+/printing/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_read_timeout 180s;
    }

    # 前端静态资源带 hash，可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
