# /etc/nginx/cwq-include/cwq-host-map.conf
#
# **Host 白名单**（80 端口跳转 + 443 端口准入，共用这一份）。
#
# ===========================================================================
# ⚠️ 这份文件**已装在当前生产机 43.138.178.174 上并生效**。
#
#    acct.xins.live 自 2026-10-24 起部署在 43.138.178.174 —— 那台机是
#    **源码编译的标准 nginx 布局**（/etc/nginx 主配置 + conf.d/），
#    本文件正是装在那儿的（/etc/nginx/cwq-include/cwq-host-map.conf）。
#
#    它**曾经**只适用于标准布局：2026-10-24 之前 acct 部署在宝塔主机上
#    （先是 110.42.44.53，后是 8.155.171.57），走的是
#    /www/server/panel/vhost/nginx/acct.xins.live.conf 那份独立 vhost，
#    那时本文件从未被装到服务器上，也没有生效过 ——
#    照着下面「装到哪」那段在宝塔机器上操作，会「做完什么都没变」：
#      · /etc/nginx/cwq-include/ 建出来了，但宝塔主配置
#        （/www/server/nginx/conf/nginx.conf）只 include
#        /www/server/panel/vhost/nginx/*.conf，那条 include 不存在；
#      · ``nginx -t`` 照样通过（**未加载的文件不会报错**）；
#      · ``reload`` 照样成功。两次「成功」都不代表这份 map 生效了。
#
#    宝塔布局下也不需要这份东西：vhost 用的是 server_name 精确匹配，
#    伪造 Host 的请求会落到宝塔自己的默认站点，acct 的 301 不会被触发。
#    实测（2026-10-17）：``Host: evil.example`` 得到 200 而**不是** 301 到
#    evil.example，开放重定向不成立。
#
#    那两台宝塔机已在本项目清理中下线（2026-10-24），本文件现在是
#    生产机上的**在用配置**，不是备查件。
# ===========================================================================
#
# ---------------------------------------------------------------------------
# 装到哪（**仅限标准 nginx 布局**，宝塔见上面的警告）
# ---------------------------------------------------------------------------
#   mkdir -p /etc/nginx/cwq-include
#   cp deploy/nginx/cwq-host-map.conf /etc/nginx/cwq-include/
#   # 改下面的正式域名
#   nginx -t && systemctl reload nginx
#
#   装完必须**反查一次它真的被加载了**，否则你只是在复制一个静默失效的文件：
#     grep -c cwq_https_redirect /etc/nginx/conf/nginx.conf \
#       /etc/nginx/conf.d/*.conf 2>/dev/null
#   或直接打一发伪造 Host，期望是「无响应」而不是 301：
#     curl -i -H 'Host: evil.example' http://127.0.0.1/

#
# 目录**必须**是 /etc/nginx/cwq-include/，不能是 conf.d/ —— 主配置的
# ``include /etc/nginx/conf.d/*.conf;`` 会把这里的文件再加载一遍，
# 于是同一个 ``map $host`` 被声明两次，nginx 直接 emerg。
# （与 cwq-rl-zone 的理由完全一样，见 cwq.conf 文件头。）
#
# ---------------------------------------------------------------------------
# 为什么需要它
# ---------------------------------------------------------------------------
# cwq.conf 里的 80 端口 server 原来写的是：
#
#     return 301 https://$host$request_uri;
#
# $host 取自客户端的 Host 请求头，而那个 server 的 server_name 是 ``_``
# —— 兜底匹配一切，nginx 不会拿它跟任何白名单核对。于是：
#
#     curl -H 'Host: evil.example' http://<服务器 IP>/
#     HTTP/1.1 301 Moved Permanently
#     Location: https://evil.example/
#
# 这是一个开放重定向（Open Redirect）：钓鱼链接的主机名看着是自家的，
# 点进去人却在别处；共享缓存与浏览器历史也会被这记跳转污染。
#
# 现在 map 把 $host 映射成一个**查过表**的跳转目标：
#   · 命中白名单 → 映射出固定的跳转地址，用它跳转；
#   · 未命中     → 映射为空串，cwq.conf 里 `if ($cwq_https_redirect = "")`
#                   走 return 444，直接掐断连接（不回 400、不跳转）。
#
# 未命中的处理为什么是 444 而不是「跳到默认域名」：跳到默认域名等于告诉
# 攻击者「这里有个服务，但它认的是另一个域名」，白名单探测的成本是零。
# 444 连响应都不给，对方无法区分「端口关闭」「服务不存在」「Host 不对」。
#
# **443 端口也用这张表**（审查 P0-1 的另一半）：原来只有 80 端口查表，
# 443 完全不看 Host。那个不对称不只是「多一个人能连上来」——``$host`` 会
# 一路传到后端（``proxy_set_header Host $host;``），而后端有一处**按请求
# base_url 拼验证链接**的地方（管理员二次验证邮件），于是带
# ``Host: evil.example`` 的登录请求会让系统发出一封**链接指向攻击者域名**
# 的验证邮件。现在 443 也走同一条规则：**查不出 ⇒ 444**。
#
# ---------------------------------------------------------------------------
# 怎么填
# ---------------------------------------------------------------------------
# 下面默认只放本机。上线时把正式域名加进去，**一行一个**，值与 key 都用
# 引号包住（key 含端口或通配时引号是必须的）。
#
# 注意 Host 头里的主机名**不带端口**，所以这里不要写 https:// 或 :443；
# map 的值才写完整跳转地址。
#
# 正式域名已填在下方 map 里（acct.xins.live，2026-10-17 定）。此处保留一份
# 完整形态供以后新增域名时照抄：
#
#   map $host $cwq_https_redirect {
#       default          "";
#       "localhost"      "https://localhost$request_uri";
#       "127.0.0.1"      "https://127.0.0.1$request_uri";
#       "acct.xins.live" "https://acct.xins.live$request_uri";
#   }
#
# 多域名就多写几行；通配形如 "*.example.com"。留空字符串作 default 是必须的：
# 它就是「未知 Host 拒绝服务」这条规则的实现。
#
# ---------------------------------------------------------------------------
# 这张表现在同时是 **443 端口的 Host 白名单**（审查 P0-1）
# ---------------------------------------------------------------------------
#
# 原来只有 80 端口用它（未命中 ⇒ 444），443 端口**完全不看 Host** ——
# 于是同一个 nginx 上「80 认域名、443 谁来都接待」。那个不对称有实打实的
# 后果：``$host`` 会一路传到后端（``proxy_set_header Host $host;``），
# 而后端有一处**按请求 base_url 拼验证链接**的地方（管理员二次验证邮件），
# 攻击者带 ``Host: evil.example`` 登录一次，就会收到一封**系统自己发出的、
# 链接却指向攻击者域名**的邮件 —— 二次验证反而成了钓鱼投递通道。
#
# 现在 443 也用这张表：**查得出（非空）= 白名单内，查不出（空串）= 444**。
#
# **为什么不再单独写一张「已知 Host」表**：两张表一定会漂移（加域名时只改
# 一张是迟早的事），而漂移的后果就是「80 跳到某处、443 却不认」——
# 那正是这次要消灭的不对称。**一张表 = 一个事实**。
#
# 下面这个不变量因此必须成立：**表里每一行都对应一个合法域名**，
# 而 default 是空串。于是「非空 ⇔ 在白名单里」是这张表的固有性质，
# 不依赖任何额外的约定。

map $host $cwq_https_redirect {
    default          "";
    "localhost"      "https://localhost$request_uri";
    "127.0.0.1"      "https://127.0.0.1$request_uri";

    # 正式域名（2026-10-17 定）。
    #
    # 顺序注意：**先把这个文件装到目标机并 reload nginx，再去加 DNS 的 A 记录。**
    # 反过来做的话，DNS 已生效而 map 里还没有这一行，未知 Host 就走 default
    # 被 return 444 直接掐断 —— 现象是「域名解析得通但网页打不开」，
    # 而且 nginx 日志里看不出原因（444 根本不写访问日志），极难排查。
    "acct.xins.live" "https://acct.xins.live$request_uri";
}
