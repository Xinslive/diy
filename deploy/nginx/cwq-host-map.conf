# /etc/nginx/cwq-include/cwq-host-map.conf
#
# 80 端口跳转白名单（审计 P2-9）。
#
# ---------------------------------------------------------------------------
# 装到哪
# ---------------------------------------------------------------------------
#   mkdir -p /etc/nginx/cwq-include
#   cp deploy/nginx/cwq-host-map.conf /etc/nginx/cwq-include/
#   # 改下面的正式域名
#   nginx -t && systemctl reload nginx
#
# 目录**必须**是 /etc/nginx/cwq-include/，不能是 conf.d/ —— 主配置的
# ``include /etc/nginx/conf.d/*.conf;`` 会把这里的文件再加载一遍，
# 于是同一个 ``map $host`` 被声明两次，nginx 直接 emerg。
# （与 cwq-rl-zone 的理由完全一样，见 cwq.conf 文件头。）
#
# ---------------------------------------------------------------------------
# 为什么需要它
# ---------------------------------------------------------------------------
# cwq.conf 里的 80 端口 server 原来写的是：
#
#     return 301 https://$host$request_uri;
#
# $host 取自客户端的 Host 请求头，而那个 server 的 server_name 是 ``_``
# —— 兜底匹配一切，nginx 不会拿它跟任何白名单核对。于是：
#
#     curl -H 'Host: evil.example' http://<服务器 IP>/
#     HTTP/1.1 301 Moved Permanently
#     Location: https://evil.example/
#
# 这是一个开放重定向（Open Redirect）：钓鱼链接的主机名看着是自家的，
# 点进去人却在别处；共享缓存与浏览器历史也会被这记跳转污染。
#
# 现在 map 把 $host 映射成一个**查过表**的跳转目标：
#   · 命中白名单 → 映射出固定的跳转地址，用它跳转；
#   · 未命中     → 映射为空串，cwq.conf 里 `if ($cwq_https_redirect = "")`
#                   走 return 444，直接掐断连接（不回 400、不跳转）。
#
# 未命中的处理为什么是 444 而不是「跳到默认域名」：跳到默认域名等于告诉
# 攻击者「这里有个服务，但它认的是另一个域名」，白名单探测的成本是零。
# 444 连响应都不给，对方无法区分「端口关闭」「服务不存在」「Host 不对」。
#
# ---------------------------------------------------------------------------
# 怎么填
# ---------------------------------------------------------------------------
# 下面默认只放本机。上线时把正式域名加进去，**一行一个**，值与 key 都用
# 引号包住（key 含端口或通配时引号是必须的）。
#
# 注意 Host 头里的主机名**不带端口**，所以这里不要写 https:// 或 :443；
# map 的值才写完整跳转地址。
#
# 正式域名已填在下方 map 里（acct.xins.live，2026-10-17 定）。此处保留一份
# 完整形态供以后新增域名时照抄：
#
#   map $host $cwq_https_redirect {
#       default          "";
#       "localhost"      "https://localhost$request_uri";
#       "127.0.0.1"      "https://127.0.0.1$request_uri";
#       "acct.xins.live" "https://acct.xins.live$request_uri";
#   }
#
# 多域名就多写几行；通配形如 "*.example.com"。留空字符串作 default 是必须的：
# 它就是「未知 Host 拒绝服务」这条规则的实现。

map $host $cwq_https_redirect {
    default          "";
    "localhost"      "https://localhost$request_uri";
    "127.0.0.1"      "https://127.0.0.1$request_uri";

    # 正式域名（2026-10-17 定）。
    #
    # 顺序注意：**先把这个文件装到目标机并 reload nginx，再去加 DNS 的 A 记录。**
    # 反过来做的话，DNS 已生效而 map 里还没有这一行，未知 Host 就走 default
    # 被 return 444 直接掐断 —— 现象是「域名解析得通但网页打不开」，
    # 而且 nginx 日志里看不出原因（444 根本不写访问日志），极难排查。
    "acct.xins.live" "https://acct.xins.live$request_uri";
}
