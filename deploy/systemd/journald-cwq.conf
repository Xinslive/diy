# /etc/systemd/journald.conf.d/cwq.conf
#
# systemd 的 journal 上限。**显式写死，而不是靠默认值。**
#
# # 为什么要管
#
# systemd 的默认值是 ``SystemMaxUse`` = **磁盘的 10%**（上限 4G）。当前生产机
# 磁盘 49 G ⇒ 上限约 4.9 G，被 4 G 封顶。
#
# 「有上限」听着像够了，但这套系统是**单机跑全部业务**的：数据库、备份产物、
# 发版归档、日志文件全在这块盘上。journal 吃掉 4 G 意味着磁盘只剩 8% 的余量，
# 而那 4 G 里绝大部分是**几个月前**没人再看的启动日志 —— 为了它挤掉的是
# 「备份产物多存 4 G」，那才是出事时真正要用的东西。
#
# 为什么是**大小**上限而不是时间上限：日志的价值在「最近出事了没」，不在
# 「三个月前的日志还在不在」。时间上限会**按年龄销毁证据**（比如某次未授权
# 登录的痕迹），而大小上限只是「满了就从头写」—— 同样的信息量，多出来的
# 那些从来没被读过。
#
# 判据：journald 占了多少。
#   journalctl --disk-usage
#
# 装法由 deploy.sh 自动完成（渲染后写进 /etc/systemd/journald.conf.d/）。
# 改完要 ``systemctl restart systemd-journald`` 才生效。
#
# 手工装法：
#   cp deploy/systemd/journald-cwq.conf /etc/systemd/journald.conf.d/cwq.conf
#   systemctl restart systemd-journald
[Journal]
# 整个 journal 目录的上限（软上限，超过后按文件轮转）。
SystemMaxUse=500M
# 单个日志文件的上限。必须小于 SystemMaxUse，否则大文件会先占满。
SystemMaxFileSize=50M
# 保留的日志文件个数（每个 SystemMaxFileSize）。
SystemMaxFiles=20
