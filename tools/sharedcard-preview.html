<script type="application/json" id="shared-card-v2-data">__SHARED_CARD_DATA__</script>
<script>
(() => {
  const root = document.getElementById('shared-card-v2');
  const D = JSON.parse(document.getElementById('shared-card-v2-data').textContent);
  const txMap = new Map(D.transactions.map(tx => [tx.id,tx]));
  const entryMap = new Map(D.entries.map(e => [e.id,e]));
  const bookMap = new Map(D.books.map(b => [b.id,b]));
  const importMap = new Map(D.imports.map(f => [f.id,f]));
  const months = D.months.map(m=>m.month);
  const ledgerChoices = [...new Set([...months,...months.map(previousMonth)])].sort();
  const latestMonth = months.at(-1);
  const state = {tab:'work',bankMonth:latestMonth,policy:'previous',ledgerMonths:[previousMonth(latestMonth)],
    direction:'ALL',bankOrder:'asc',lane:'all',query:'',ledgerQuery:'',periodSearch:'',ledgerBook:'ALL',page:0,entryPage:0,
    selectedBank:new Set(),selectedEntries:new Set(),groups:[],owners:new Map(),focus:null,
    importOpen:false,showPeriods:false,message:'',error:false,nextGroup:1,
    lineMonth:previousMonth(latestMonth)};
  const design = {layout:'columns',density:'compact'};
  const PAGE = 8;
  const esc = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = value => value === null || value === undefined || value === '' ? '—' :
    Number(value).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const cash = value => value === null ? '—' : fmt(value / 100);
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const button = (label,action,more='',disabled=false,primary=false) => `<button type="button" class="scv-button cursor-interaction${primary?' scv-primary':''}" data-action="${action}" ${more}${disabled?' disabled':''}>${label}</button>`;
  const link = (label,action,more='') => `<button type="button" class="scv-link cursor-interaction" data-action="${action}" ${more}>${label}</button>`;
  const pickedBank = () => [...state.selectedBank].map(id=>txMap.get(id)).filter(Boolean);
  const pickedEntries = () => [...state.selectedEntries].map(id=>entryMap.get(id)).filter(Boolean);
  const sum = rows => rows.reduce((total,row)=>total+(Number.isSafeInteger(row.amount_cents)?row.amount_cents:0),0);
  const txGroup = id => state.groups.find(g=>g.bank.includes(id));
  const entryGroup = id => state.groups.find(g=>g.entries.includes(id));
  const ownerOf = tx => txGroup(tx.id)?.book_id??(state.owners.has(tx.id)?state.owners.get(tx.id):tx.owner_book_id);
  const ownerConflict = tx => tx.ownership==='CONFLICT'&&!state.owners.has(tx.id);
  const ownershipLabel = tx => ownerConflict(tx)?'归属冲突':ownerOf(tx)?
    `${bookMap.get(ownerOf(tx))?.name||'原账套'} · ${txGroup(tx.id)?'本页核对':state.owners.has(tx.id)?'本页指定':tx.ownership==='MANUAL'?'人工':'初筛'}`:'归属待定';
  const inLedgerScope = e => e&&state.ledgerMonths.includes(e.period);
  // **收支方向的两侧口径**：银行 IN（收钱）↔ 账面 借方；银行 OUT（付钱）↔ 账面 贷方。
  // 两侧的符号因此是同一件事：银行 −5,000（支出）只能对上账面 −5,000（贷方）。
  const signedTx = t => Number.isSafeInteger(t.amount_cents)?t.amount_cents*(t.direction==='IN'?1:-1):0;
  const signedEntry = e => Number.isSafeInteger(e.amount_cents)?e.amount_cents*(e.direction==='DEBIT'?1:-1):0;
  // 「等额」必须**连方向一起看**。只看金额大小，会把 +5,000 的收入也标成
  // 「与所选合计等额」—— 看着像能核对，其实方向相反，服务器会整组拒绝。
  function entryTag(target,e){if(!target)return'';const signed=signedEntry(e);
    if(target===signed)return' · <span class="scv-amber">与所选合计等额</span>';
    if(Math.abs(target)===Math.abs(signed))return' · <span class="scv-red">等额但方向相反</span>';
    return'';}
  const toCents = value => {if(value===null||value===undefined)return null;const match=String(value).match(/^(-?)(\d+)(?:\.(\d{1,2}))?$/);return match?(match[1]?-1:1)*(Number(match[2])*100+Number((match[3]||'').padEnd(2,'0'))):null;};
  function previousMonth(month) { const [y,m]=month.split('-').map(Number),i=y*12+m-2;return `${Math.floor(i/12)}-${String(i%12+1).padStart(2,'0')}`; }
  function inheritedScope() { const basis=state.bankMonth?[state.bankMonth]:months;return [...new Set(basis.flatMap(m=>state.policy==='same'?[m]:state.policy==='both'?[previousMonth(m),m]:[previousMonth(m)]))].sort(); }
  function applyScope() { if(state.policy!=='custom')state.ledgerMonths=inheritedScope();state.lineMonth=state.ledgerMonths.at(-1);state.entryPage=0;for(const id of state.selectedEntries)if(!inLedgerScope(entryMap.get(id)))state.selectedEntries.delete(id); }
  function exactCandidates(tx) { return D.entries.filter(e=>inLedgerScope(e)&&e.amount_cents===tx.amount_cents&&e.amount_cents>0&&((tx.direction==='IN'&&e.direction==='DEBIT')||(tx.direction==='OUT'&&e.direction==='CREDIT'))); }
  function status(tx) { if(txGroup(tx.id))return '<span class="scv-tag scv-tag-green">本页已核对</span>';if(ownerConflict(tx))return '<span class="scv-tag scv-tag-red">归属冲突</span>';const choices=exactCandidates(tx);return choices.length?`<span class="scv-tag scv-tag-amber">${choices.length===1?'同额候选':choices.length+' 笔候选'}</span>`:'<span class="scv-tag">待核对</span>'; }
  function bankRows(ignoreLane=false) {
    const query=state.query.trim().toLowerCase().replaceAll(',','');
    const bank=D.transactions.filter(tx=>(!state.bankMonth||tx.tx_date?.startsWith(state.bankMonth))
      &&(state.direction==='ALL'||tx.direction===state.direction)
      &&(!query||[tx.purpose,tx.summary,tx.counterparty,tx.amount,ownershipLabel(tx)].join(' ').toLowerCase().includes(query)));
    const filtered=(ignoreLane?bank:bank.filter(tx=>state.lane==='all'||
      (state.lane==='conflict'&&ownerConflict(tx))||
      (state.lane==='candidates'&&!txGroup(tx.id)&&exactCandidates(tx).length>0)||
      (state.lane==='receipts'&&tx.direction==='IN'&&!txGroup(tx.id))||
      (state.lane==='confirmed'&&txGroup(tx.id))||
      (state.lane==='new'&&D.imports.at(-1).new_ids.includes(tx.id)))).slice();
    return state.bankOrder==='asc'?filtered:filtered.reverse();
  }
  function setMessage(message,error=false) {state.message=message;state.error=error;}
  function saveState() {
    if(!window.openai?.setWidgetState)return;
    window.openai.setWidgetState({modelContent:{design:'共享卡连续资金线',view:state.tab,bankMonth:state.bankMonth||'全部',ledgerMonths:state.ledgerMonths,layout:design.layout},
      privateContent:{version:1,tab:state.tab,bankMonth:state.bankMonth,policy:state.policy,ledgerMonths:state.ledgerMonths,density:design.density,layout:design.layout}}).catch(()=>{});
  }
  function restore(saved) {if(saved?.version!==1)return;if(['work','records','members'].includes(saved.tab))state.tab=saved.tab;
    if(saved.bankMonth===''||months.includes(saved.bankMonth))state.bankMonth=saved.bankMonth;
    if(['same','previous','both','custom'].includes(saved.policy))state.policy=saved.policy;
    if(Array.isArray(saved.ledgerMonths)&&saved.ledgerMonths.length)state.ledgerMonths=saved.ledgerMonths.filter(m=>ledgerChoices.includes(m));
    state.lineMonth=state.ledgerMonths.at(-1);
    if(['columns','stack'].includes(saved.layout))design.layout=saved.layout;if(['compact','relaxed'].includes(saved.density))design.density=saved.density;}
  function monthRail() {return `<div class="scv-toolbar"><label>跳转月份 <select class="scv-select" aria-label="跳转银行月份" data-field="bankMonth"><option value="">全部月份</option>${months.map(m=>`<option value="${m}"${state.bankMonth===m?' selected':''}>${m}</option>`).join('')}</select></label></div><div class="scv-months" aria-label="银行交易月份">${[['','全部',D.summary.transactions],...D.months.map(m=>[m.month,m.month.slice(2).replace('-','.'),m.count])].map(([value,label,count])=>`<button type="button" class="scv-month cursor-interaction" data-month="${value}" aria-label="${value||'全部月份'}，${count}笔" aria-pressed="${state.bankMonth===value}"><span>${label}</span><span class="scv-small scv-number">${count} 笔</span></button>`).join('')}</div>`;}
  function scopeBar() {return `<section class="scv-scope" aria-label="账面查找范围"><div class="scv-row scv-spread"><div class="scv-row"><span>账面查找范围</span><select class="scv-select" aria-label="常用账面范围" data-field="policy"><option value="previous"${state.policy==='previous'?' selected':''}>银行上月</option><option value="both"${state.policy==='both'?' selected':''}>银行上月及当月</option><option value="same"${state.policy==='same'?' selected':''}>银行当月</option><option value="custom"${state.policy==='custom'?' selected':''}>自选期间</option></select><strong class="scv-number">${state.ledgerMonths.length>3?state.ledgerMonths[0]+' 至 '+state.ledgerMonths.at(-1):state.ledgerMonths.join('、')}</strong></div>${link(state.showPeriods?'收起期间':'调整期间','periods')}</div>${state.showPeriods?`<input type="search" class="scv-select scv-period-search" aria-label="查找账面期间" data-field="periodSearch" placeholder="输入年份 / 月份" value="${esc(state.periodSearch)}"><div class="scv-scope-chips">${ledgerChoices.filter(m=>m.includes(state.periodSearch.trim())).map(m=>`<button type="button" class="scv-scope-chip cursor-interaction" data-period="${m}" aria-pressed="${state.ledgerMonths.includes(m)}">${m}</button>`).join('')}</div>`:''}<div class="scv-subline">银行日期与凭证日期并列保留；调整范围只影响查找，不改账期。</div></section>`;}
  function searchToolbar() {return `<div class="scv-panel-tools"><label class="scv-search">${icon('search')}<input type="search" aria-label="查找银行流水" data-field="query" placeholder="用途、对方、摘要或金额" value="${esc(state.query)}"></label><select class="scv-select" aria-label="收付方向" data-field="direction">${[['ALL','全部收付'],['IN','收入'],['OUT','支出']].map(([value,label])=>`<option value="${value}"${state.direction===value?' selected':''}>${label}</option>`).join('')}</select></div>`;}
  function lanes() {const rows=bankRows(true),definitions=[['all','全部',rows.length],['candidates','有候选',rows.filter(t=>!txGroup(t.id)&&exactCandidates(t).length).length],['receipts','收款待核对',rows.filter(t=>t.direction==='IN'&&!txGroup(t.id)).length],['conflict','归属冲突',rows.filter(ownerConflict).length],['confirmed','本页已核对',rows.filter(t=>txGroup(t.id)).length]];if(state.lane==='new')definitions.push(['new','本次新增',rows.filter(t=>D.imports.at(-1).new_ids.includes(t.id)).length]);return `<div class="scv-lanes">${definitions.map(([key,label,count])=>`<button type="button" class="scv-lane cursor-interaction" data-lane="${key}" aria-pressed="${state.lane===key}">${label}<span class="scv-lane-count">${count}</span></button>`).join('')}</div>`;}
  function pagination(total,page,kind) {const last=Math.max(0,Math.ceil(total/PAGE)-1);return `<div class="scv-page"><span>${total?`${page*PAGE+1}—${Math.min(total,(page+1)*PAGE)} / ${total} ${kind==='month'?'期':'笔'}`:`0 ${kind==='month'?'期':'笔'}`}</span><div class="scv-row">${button('上一页','page',`data-kind="${kind}" data-delta="-1"`,page===0)}<span>${page+1} / ${last+1}</span>${button('下一页','page',`data-kind="${kind}" data-delta="1"`,page>=last)}</div></div>`;}
  function bankTable() {
    const rows=bankRows();
    const last=Math.max(0,Math.ceil(rows.length/PAGE)-1);state.page=Math.min(state.page,last);const slice=rows.slice(state.page*PAGE,(state.page+1)*PAGE);
    return `<div class="scv-table-wrap"><table aria-label="待核对银行交易"><thead><tr><th class="scv-pick">选择</th><th>银行日期</th><th>对方 / 用途</th><th class="scv-td-number">金额</th><th>核对 / 归属</th></tr></thead><tbody>${slice.length?slice.map(tx=>`<tr data-tx="${tx.id}" data-selected="${state.selectedBank.has(tx.id)}"><td class="scv-pick"><input type="checkbox" class="cursor-interaction" data-bank-pick="${tx.id}" aria-label="选择银行交易 ${tx.tx_date} ${tx.direction==='IN'?'收入':'支出'} ${tx.amount}"${state.selectedBank.has(tx.id)?' checked':''}${txGroup(tx.id)?' disabled':''}></td><td class="scv-date-cell">${link(esc(tx.tx_date),'inspect',`data-id="${tx.id}"`)}<span class="scv-subline scv-number">${esc(tx.tx_time)}</span></td><td class="scv-summary-cell">${link(esc(tx.purpose&&tx.purpose!=='付款'&&tx.purpose!=='转账'?tx.purpose:tx.counterparty||tx.summary),'inspect',`data-id="${tx.id}"`)}<span class="scv-subline">${esc(tx.summary)}${tx.sources.length>1?' · '+link(tx.sources.length+' 份来源','inspect',`data-id="${tx.id}"`):''}</span></td><td class="scv-td-number ${tx.direction==='IN'?'scv-green':''}">${tx.direction==='IN'?'+':'−'}${fmt(tx.amount)}<span class="scv-subline">余额 ${fmt(tx.balance)}</span></td><td>${link(status(tx),'inspect',`data-id="${tx.id}"`)}<span class="scv-subline ${ownerConflict(tx)?'scv-red':''}">${esc(ownershipLabel(tx))}</span></td></tr>`).join(''):`<tr><td colspan="5"><div class="scv-empty">这个范围没有相应流水。${state.lane==='confirmed'?'<p>旧版初筛与人工归属尚未建立分录级核对关系。</p>':''}</div></td></tr>`}</tbody></table></div>${pagination(rows.length,state.page,'bank')}`;
  }
  function inspector() {
    const tx=txMap.get(state.focus);if(!tx)return '';
    const evidence=tx.allocation_evidence,g=txGroup(tx.id),locked=Boolean(g||tx.has_legacy_voucher);
    return `<section class="scv-inspect" aria-label="流水来源与归属"><div class="scv-panel-head"><div><strong>${esc(tx.tx_date)} ${tx.direction==='IN'?'收入':'支出'} ${fmt(tx.amount)}</strong><span class="scv-subline">交易后余额 ${fmt(tx.balance)} · ${esc(tx.counterparty)} · ${esc(tx.purpose||tx.summary)}</span></div><div class="scv-row">${button('核对这笔','inspect-work',`data-id="${tx.id}"`,locked)}${button('收起','close-inspect')}</div></div><div class="scv-source-list">${tx.sources.map(s=>`<div class="scv-source-line"><div class="scv-source-name">${esc(s.filename)}<span class="scv-subline">原始第 ${s.seq} 行 · 户名 ${esc(s.counterparty)}${s.legacy_match_months?' · 原匹配期间 '+esc(s.legacy_match_months):''}</span></div><span class="scv-tag">来源 ${s.statement_id}</span></div>`).join('')}</div><div class="scv-owner-evidence"><div class="scv-row"><strong>原归属证据</strong>${ownerConflict(tx)?'<span class="scv-tag scv-tag-red">两本账都留有归属</span>':''}</div>${evidence.length?evidence.map(a=>`<div><span class="${ownerConflict(tx)?'scv-red':''}">${esc(bookMap.get(a.book_id)?.name||a.book_id)}</span> · ${a.status==='ALLOCATED'?'人工指定':'原初筛'}<span class="scv-subline">${esc(a.reason)}</span></div>`).join(''):'<div class="scv-muted">尚未指定归属</div>'}${ownerConflict(tx)?`<div class="scv-row"><span class="scv-small scv-muted">本页选择归属：</span>${[...new Set(evidence.map(a=>a.book_id))].map(id=>button(esc(bookMap.get(id)?.name||id),'resolve-owner',`data-id="${tx.id}" data-book="${id}"`)).join('')}</div>`:''}<div class="scv-row"><label for="scv-owner-select">本页指定 / 更改归属</label><select id="scv-owner-select" class="scv-select" data-owner-tx="${tx.id}"${locked?' disabled':''}><option value="">${ownerConflict(tx)?'请核实后选择':'归属待定'}</option>${D.books.map(b=>`<option value="${b.id}"${ownerOf(tx)===b.id?' selected':''}>${esc(b.name)}</option>`).join('')}</select><span class="scv-small scv-muted">${locked?'已有关联，先核实原核对组':'原归属证据保留；更改仅在本页演示'}</span></div></div>${g?`<div class="scv-owner-evidence"><strong>已连接的账面资金线</strong>${g.entries.map(id=>{const e=entryMap.get(id);if(!e)return `<div class="scv-red">原关联分录已变化或不可读，请复核本组后撤销重选。</div>`;return `<div>${link(esc(`${e.book_name} · ${e.voucher_date} ${e.voucher_no} · ${fmt(e.amount)}`),'entry-line',`data-entry-id="${id}"`)}<span class="scv-subline">${esc(e.summary)} · 本账交易后余额 ${cash(e.book_balance_cents??null)}</span></div>`;}).join('')}</div>`:''}</section>`;
  }
  function monthLedger(period,bookId=state.ledgerBook) {
    if(!period)return null;
    if(bookId==='ALL')return {opening:toCents(period.opening),debit:toCents(period.debit),credit:toCents(period.credit),closing:toCents(period.closing),valid:period.complete};
    const b=period.books.find(b=>b.book_id===Number(bookId));
    return b?{opening:b.opening_cents,debit:b.debit_cents,credit:b.credit_cents,closing:b.closing_cents,valid:b.valid}:null;
  }
  function fundValues(values,labels=['期初','收入','支出','期末']) {
    return `<div class="scv-fund-values">${['opening','debit','credit','closing'].map((key,i)=>`<div><span>${labels[i]}</span><strong>${cash(values?.[key]??null)}</strong></div>`).join('')}</div>`;
  }
  function dualSummary() {
    const bank=D.months.find(m=>m.month===state.bankMonth),whole=D.summary;
    const bankValues={opening:toCents(bank?bank.opening:whole.opening_inferred),debit:toCents(bank?bank.income:whole.income),credit:toCents(bank?bank.expense:whole.expense),closing:toCents(bank?bank.closing:whole.closing_observed)};
    const summaryBook=state.ledgerBook,period=D.ledger.months.find(m=>m.month===state.lineMonth),v=monthLedger(period,summaryBook);
    return `<div class="scv-dual-summary"><section class="scv-fund-summary" aria-label="银行所选月份资金"><div class="scv-row scv-spread"><strong>银行资金线</strong><span class="scv-small scv-muted">${state.bankMonth||'全部已导入范围'}</span></div>${fundValues(bankValues,['首笔前余额','收入','支出','末笔后余额'])}</section><section class="scv-fund-summary" aria-label="账面所选期间资金"><div class="scv-row scv-spread"><strong>账面资金线</strong><span class="scv-small scv-muted">${esc(state.lineMonth)} · ${summaryBook==='ALL'?'登记科目合计':esc(bookMap.get(Number(summaryBook))?.name)}</span></div>${fundValues(v,['期初余额','借方增加','贷方减少','期末余额'])}</section></div>`;
  }
  function availableEntries() {
    const picked=pickedBank(),amount=sum(picked),amounts=new Set(picked.map(t=>t.amount_cents));const query=state.ledgerQuery.trim().toLowerCase();
    return D.entries.filter(e=>inLedgerScope(e)&&!entryGroup(e.id)&&(state.ledgerBook==='ALL'||e.book_id===Number(state.ledgerBook))&&
      (!query||[e.book_name,e.summary,e.voucher_no,e.amount].join(' ').toLowerCase().includes(query)))
      .sort((a,b)=>Number(state.selectedEntries.has(b.id))-Number(state.selectedEntries.has(a.id))||
        Number(b.amount_cents===amount)-Number(a.amount_cents===amount)||Number(amounts.has(b.amount_cents))-Number(amounts.has(a.amount_cents))||
        a.book_name.localeCompare(b.book_name,'zh')||a.voucher_date.localeCompare(b.voucher_date)||a.id-b.id);
  }
  function ledgerTable() {
    const entries=availableEntries(),last=Math.max(0,Math.ceil(entries.length/PAGE)-1);state.entryPage=Math.min(state.entryPage,last);
    const picked=pickedBank(),target=picked.reduce((n,t)=>n+signedTx(t),0);const sourceCount=new Map();
    for(const tx of D.transactions.filter(t=>!state.bankMonth||t.tx_date?.startsWith(state.bankMonth)))if(!txGroup(tx.id))for(const e of exactCandidates(tx))sourceCount.set(e.id,(sourceCount.get(e.id)||0)+1);
    return `<div class="scv-table-wrap"><table aria-label="账面待核对分录"><thead><tr><th class="scv-pick">选择</th><th>账套 / 凭证日期</th><th>摘要 / 凭证</th><th class="scv-td-number">金额</th></tr></thead><tbody>${entries.length?entries.slice(state.entryPage*PAGE,(state.entryPage+1)*PAGE).map(e=>`<tr data-entry="${e.id}" data-selected="${state.selectedEntries.has(e.id)}"><td class="scv-pick"><input type="checkbox" class="cursor-interaction" data-entry-pick="${e.id}" aria-label="选择账面 ${esc(e.book_name)} ${e.voucher_date} ${e.voucher_no} ${e.amount}"${state.selectedEntries.has(e.id)?' checked':''}></td><td class="scv-date-cell">${link(esc(e.book_name),'filter-book',`data-book="${e.book_id}"`)}<span class="scv-subline scv-number">${esc(e.voucher_date)}</span></td><td class="scv-summary-cell">${link(esc(e.summary),'entry-work',`data-entry-id="${e.id}"`)}<span class="scv-subline">${esc(e.voucher_no)} · ${esc(e.subject_code)}${e.voucher_status!=='POSTED'?' · <span class="scv-amber">未记账</span>':''}${entryTag(target,e)}${(sourceCount.get(e.id)||0)>1?' · <span class="scv-red">'+sourceCount.get(e.id)+' 笔流水有同额候选</span>':''}</span></td><td class="scv-td-number ${e.direction==='DEBIT'?'scv-green':''}">${e.direction==='DEBIT'?'+':'−'}${fmt(e.amount)}<span class="scv-subline">本账余额 ${cash(e.book_balance_cents??null)}</span></td></tr>`).join(''):'<tr><td colspan="4"><div class="scv-empty">当前账面范围内没有相应分录。<p>可调整期间或账套；没有关联不直接认定漏记。</p></div></td></tr>'}</tbody></table></div>${pagination(entries.length,state.entryPage,'entry')}`;
  }
  function verdict() {
    // 两侧的合计都按**带符号**算：银行 −5,000 与账面 +5,000 的差额是 −10,000，

    const base={bankTotal,entryTotal,diff,ok:false,bank,entries};
    if(!bank.length||!entries.length)return {...base,text:'选择银行交易和账面分录；月度汇总可一次选择多笔到账。'};
    if(bank.some(t=>!Number.isSafeInteger(t.amount_cents)||t.amount_cents<=0)||entries.some(e=>!Number.isSafeInteger(e.amount_cents)||e.amount_cents<=0))return {...base,text:'含金额不明或非正金额，请先核实原始数据。'};

function enhanceSharedCardSelects(root) {
  let serial = Number(root.dataset.comboboxSerial || 0);
  root.querySelectorAll('select.scv-select').forEach(select => {
    if (select.hidden || select.options.length < 7) return;
    const wrap = document.createElement('span');
    wrap.className = 'scv-combobox';
    const input = document.createElement('input');
    const list = document.createElement('div');
    const label = select.getAttribute('aria-label') || '选择';
    const id = 'scv-options-' + (++serial);
    input.type = 'text'; input.className = 'scv-select scv-combobox-input';
    input.setAttribute('role', 'combobox'); input.setAttribute('aria-label', label);
    input.setAttribute('aria-autocomplete', 'list'); input.setAttribute('aria-controls', id);

    input.disabled = select.disabled;
    list.id = id; list.className = 'scv-combobox-options'; list.setAttribute('role', 'listbox'); list.hidden = true;
    const options = Array.from(select.options).map(option => ({ value: option.value, label: option.textContent, disabled: option.disabled }));
    let visible = options, active = -1, open = false;
    const selected = () => options.find(option => option.value === select.value)?.label || '';
    const close = () => { open = false; list.hidden = true; input.value = selected(); input.setAttribute('aria-expanded', 'false'); input.removeAttribute('aria-activedescendant'); };
    const choose = option => { if (!option || option.disabled) return; select.value = option.value; close(); select.dispatchEvent(new Event('change', { bubbles: true })); };
    const paint = () => {
      list.replaceChildren();
      if (!visible.length) { const empty = document.createElement('div'); empty.className = 'scv-combobox-empty'; empty.textContent = '没有匹配的选项'; list.append(empty); }
      visible.forEach((option, index) => {
        const item = document.createElement('div'); item.id = id + '-' + index;
        item.setAttribute('role', 'option'); item.setAttribute('aria-selected', String(option.value === select.value));
        item.className = 'scv-combobox-option' + (index === active ? ' is-active' : ''); item.textContent = option.label;
        if (option.disabled) item.setAttribute('aria-disabled', 'true');

      if (event.key === 'Escape') { close(); event.preventDefault(); return; }

  });

  root.addEventListener('input',event=>{
    const input=event.target,field=input.dataset.field;if(field!=='query'&&field!=='ledgerQuery'&&field!=='periodSearch')return;
    const position=input.selectionStart;state[field]=input.value;state.page=0;state.entryPage=0;render();const next=root.querySelector(`[data-field="${field}"]`);next.focus();if(position!==null)try{next.setSelectionRange(position,position);}catch{}
  });
  restore(window.openai?.widgetState?.privateContent);render();
  window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState?.privateContent;if(saved){restore(saved);render();}});
  if(globalThis.Tweak){const tweak=new globalThis.Tweak({container:root,onChange:render});tweak.addSelect(design,'layout',{label:'核对两侧布局',options:[{label:'左右对照',value:'columns'},{label:'上下对照',value:'stack'}]});tweak.addSelect(design,'density',{label:'台账行距',options:[{label:'紧凑',value:'compact'},{label:'舒展',value:'relaxed'}]});}
})();
</script>
